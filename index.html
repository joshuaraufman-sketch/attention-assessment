  .interp-hotef .interp-header { background: #fef5e7; border-bottom-color: #f0d0a0; }
  .interp-metacog { border-color: #b8d0e4; }
  .interp-metacog .interp-header { background: #e8f0f8; border-bottom-color: #b8d0e4; }
  .interp-affect { border-color: #e0b8d4; }
  .interp-affect .interp-header { background: #faf0f5; border-bottom-color: #e0b8d4; }
  .interp-capture { border-color: #d0d0e8; }
  .interp-capture .interp-header { background: #f0f0fa; border-bottom-color: #d0d0e8; }

  .delirium-flag { margin-top: 16px; padding: 14px 18px; background: var(--c-warn-bg); border: 1px solid #e8b4ae; border-radius: var(--radius); font-size: 0.82rem; color: var(--c-warn); line-height: 1.5; }
  .delirium-flag strong { display: block; margin-bottom: 4px; }

  /* ─── Pattern classification gate (Rev 7) ─── */
  .gate-section { margin-top: 24px; padding: 20px; background: #f8f7f5; border: 2px solid var(--c-accent); border-radius: var(--radius); }
  .gate-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--c-accent); margin-bottom: 4px; }
  .gate-hint { font-size: 0.78rem; color: var(--c-text-muted); margin-bottom: 12px; }
  .gate-required { font-size: 0.72rem; font-weight: 600; color: var(--c-warn); text-transform: uppercase; letter-spacing: 0.06em; }

  /* ─── Formulation ─── */
  .formulation-section { margin-top: 24px; padding-top: 20px; border-top: 2px solid var(--c-accent); }
  .formulation-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--c-accent); margin-bottom: 16px; }

  .form-field { margin-bottom: 18px; }
  .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--c-text); margin-bottom: 4px; }
  .form-hint { display: block; font-weight: 400; font-size: 0.75rem; color: var(--c-text-muted); margin-top: 2px; margin-bottom: 8px; }
  .form-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .form-chip { font-family: var(--font-body); font-size: 0.75rem; padding: 5px 12px; border: 1.5px solid var(--c-border); border-radius: 100px; background: var(--c-surface); color: var(--c-text-secondary); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .form-chip:hover { border-color: var(--c-accent); color: var(--c-accent); }
  .form-chip-active { border-color: var(--c-accent); background: var(--c-accent); color: white; font-weight: 600; }
  .form-textarea { width: 100%; min-height: 72px; font-family: var(--font-body); font-size: 0.82rem; padding: 10px 12px; border: 1px solid var(--c-border); border-radius: var(--radius); background: var(--c-surface); color: var(--c-text); resize: vertical; outline: none; line-height: 1.5; }
  .form-textarea:focus { border-color: var(--c-accent); }
  .form-textarea-sm { width: 100%; min-height: 52px; font-family: var(--font-body); font-size: 0.82rem; padding: 8px 12px; border: 1px solid var(--c-border); border-radius: var(--radius); background: var(--c-surface); color: var(--c-text); resize: vertical; outline: none; line-height: 1.5; margin-top: 4px; }
  .form-textarea-sm:focus { border-color: var(--c-accent); }

  .action-bar { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .btn { font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; padding: 10px 20px; border-radius: var(--radius); border: none; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--c-accent); color: white; }
  .btn-primary:hover { background: var(--c-accent-hover); }
  .btn-secondary { background: var(--c-surface); color: var(--c-text-secondary); border: 1px solid var(--c-border); }
  .btn-secondary:hover { border-color: var(--c-accent); color: var(--c-accent); }

  .citation { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--c-border-light); font-size: 0.72rem; color: var(--c-text-muted); line-height: 1.5; }

  .formulation-locked { padding: 16px 20px; background: #fff8e6; border: 1px solid #f0e0b0; border-radius: var(--radius); font-size: 0.82rem; color: #7a5a10; line-height: 1.5; margin-bottom: 16px; }
`;

// ──────────────────────────────────────────────────────────────────
// Component
// ──────────────────────────────────────────────────────────────────

function AttentionAssessment() {
  const [scores, setScores] = useState({});
  const [openSections, setOpenSections] = useState({ observation: true });
  const [patientInfo, setPatientInfo] = useState({ name: "", date: "", mrn: "" });
  const [formulation, setFormulation] = useState({
    patternClass: "",
    attribution: "",
    stateVsTrait: "",
    biasTargets: "",
    confounders: "",
    plan: "",
    additionalNotes: "",
  });
  const [autoScores, setAutoScores] = useState({});
  const [pasteStatus, setPasteStatus] = useState("");
  const openWindowsRef = useRef({});
  const [copyNoteStatus, setCopyNoteStatus] = useState("");
  const [copyFullStatus, setCopyFullStatus] = useState("");

  // ── postMessage listener ──
  useEffect(() => {
    const handler = (event) => {
      try {
        const msg = event.data;
        if (!msg || msg.type !== 'bedside-tool-result' || !msg.payload) return;
        const { tool, suggestedScores } = msg.payload;
        if (!suggestedScores || typeof suggestedScores !== 'object') return;
        setScores(prev => {
          const next = { ...prev };
          Object.entries(suggestedScores).forEach(([itemId, value]) => {
            if (typeof value === 'number' && value >= 1 && value <= 5) next[itemId] = value;
          });
          return next;
        });
        setAutoScores(prev => {
          const next = { ...prev };
          const now = new Date().toLocaleTimeString();
          Object.keys(suggestedScores).forEach(itemId => { next[itemId] = { tool: tool || 'unknown', timestamp: now }; });
          return next;
        });
        setOpenSections(prev => ({ ...prev, attentional_tasks: true }));
      } catch (e) {}
    };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);

  const openTool = useCallback((file) => {
    const base = window.location.href.replace(/[^/]*$/, '');
    const w = window.open(base + file + '?parent=true', file, 'width=960,height=800');
    if (w) openWindowsRef.current[file] = w;
  }, []);

  const pasteResults = useCallback(async () => {
    let text = '';
    try { text = await navigator.clipboard.readText(); } catch {
      setPasteStatus('Cannot read clipboard'); setTimeout(() => setPasteStatus(''), 3000); return;
    }
    try {
      const payload = JSON.parse(text);
      if (!payload.tool || !payload.suggestedScores) { setPasteStatus('Not a valid tool result'); setTimeout(() => setPasteStatus(''), 3000); return; }
      setScores(prev => {
        const next = { ...prev };
        Object.entries(payload.suggestedScores).forEach(([id, v]) => { if (typeof v === 'number' && v >= 1 && v <= 5) next[id] = v; });
        return next;
      });
      setAutoScores(prev => {
        const next = { ...prev };
        const now = new Date().toLocaleTimeString();
        Object.keys(payload.suggestedScores).forEach(id => { next[id] = { tool: payload.tool, timestamp: now }; });
        return next;
      });
      setOpenSections(prev => ({ ...prev, attentional_tasks: true }));
      setPasteStatus('Applied'); setTimeout(() => setPasteStatus(''), 2500);
    } catch { setPasteStatus('Invalid JSON'); setTimeout(() => setPasteStatus(''), 3000); }
  }, []);

  const updateFormulation = useCallback((field, value) => { setFormulation(prev => ({ ...prev, [field]: value })); }, []);
  const setScore = useCallback((itemId, value) => { setScores(prev => ({ ...prev, [itemId]: prev[itemId] === value ? null : value })); }, []);
  const toggleSection = useCallback((sectionId) => { setOpenSections(prev => ({ ...prev, [sectionId]: !prev[sectionId] })); }, []);

  const getSectionAvg = (section) => {
    const rated = section.items.filter(i => !i.isQualitative).map(i => scores[i.id]).filter(v => v != null);
    if (rated.length === 0) return null;
    return rated.reduce((a, b) => a + b, 0) / rated.length;
  };

  const getSectionCompletion = (section) => {
    const total = section.items.length;
    const done = section.items.filter(i => scores[i.id] != null).length;
    return `${done}/${total}`;
  };

  const checkDeliriumTriad = () => {
    const obsAvg = getSectionAvg(SECTIONS[SEC_IDX.observation]);
    const oriAvg = getSectionAvg(SECTIONS[SEC_IDX.orientation]);
    const perplexity = scores["obs_6"];
    if (obsAvg !== null && oriAvg !== null && perplexity !== null) return obsAvg <= 2 && oriAvg <= 2 && perplexity <= 2;
    return false;
  };

  const getTenacityVigilancePattern = () => {
    const t = scores["dyn_1"], v = scores["dyn_2"];
    if (t == null || v == null) return null;
    if (t >= 4 && v <= 2) return { label: "Hypertenacity + Hypovigilance", description: "Attention rigidly fixed on specific content while capacity to shift is reduced.", clinicalContext: "Classic pattern in delusional depression and fixed preoccupations. Bleuler's antagonistic tenacity-vigilance relationship.", differentials: "Delusional depression, severe OCD, catatonic states, melancholic rumination, paranoid fixation.", nextSteps: "Assess content of fixation. Evaluate mood congruence. Screen for psychotic features.", severity: "warn" };
    if (t <= 2 && v >= 4) return { label: "Hypotenacity + Hypervigilance", description: "Cannot sustain focus on any target, shifts rapidly to every stimulus.", clinicalContext: "Characteristic of delirium tremens, acute mania, severe agitation. Norepinephrine overdrive.", differentials: "Substance withdrawal, hyperactive delirium, acute mania, severe anxiety/panic, stimulant intoxication.", nextSteps: "Urgent: rule out delirium (CAM/DRS-R-98). Obtain vitals. Medication reconciliation.", severity: "danger" };
    if (t <= 2 && v <= 2) return { label: "Hypotenacity + Hypovigilance", description: "Global attentional collapse — neither focus nor shifting is preserved.", clinicalContext: "Most severe form. Strongly associated with hypoactive delirium, often missed.", differentials: "Hypoactive delirium, obtundation, severe depression with psychomotor retardation, advanced dementia.", nextSteps: "High priority: formal delirium screening. Check metabolic panel, CBC, UA, medication levels.", severity: "danger" };
    if (t >= 4 && v >= 4) return { label: "Hypertenacity + Hypervigilance", description: "Both concentration and shifting appear heightened — apparent hyperprosexia.", clinicalContext: "Controversial concept. May reflect hypomania, stimulant effects, or anxiety-driven hyperarousal.", differentials: "Hypomania, stimulant use, flow states, prodromal mania.", nextSteps: "Monitor for evolution into mania. Assess sleep patterns. Screen for substance use.", severity: "info" };
    return null;
  };

  const resetAll = () => {
    setScores({});
    setAutoScores({});
    setFormulation({ patternClass: "", attribution: "", stateVsTrait: "", biasTargets: "", confounders: "", plan: "", additionalNotes: "" });
  };

  // ── Computed values ──
  const sectionAvgs = {};
  SECTIONS.forEach(s => { sectionAvgs[s.id] = getSectionAvg(s); });

  const scoredAvgs = SCORED_DOMAINS.map(id => sectionAvgs[id]).filter(v => v != null);
  const globalAvg = scoredAvgs.length > 0 ? scoredAvgs.reduce((a, b) => a + b, 0) / scoredAvgs.length : null;
  const deliriumTriad = checkDeliriumTriad();
  const tvPattern = getTenacityVigilancePattern();

  // Diagnostic pathway engine — minimum data gate
  const minDataMet = (
    scores["temp_1"] != null &&
    Object.keys(scores).filter(k => k.startsWith('obs_')).length >= 2 &&
    Object.keys(scores).filter(k => k.startsWith('dyn_')).length >= 3
  );
  const pathwayResult = minDataMet ? evaluatePathways(scores, sectionAvgs) : null;

  const PATTERN_CHIPS = [
    "Stable trait inattentive pattern (ADHD-I consistent)",
    "Stable trait combined pattern (ADHD-C consistent)",
    "State-dependent attentional impairment",
    "Affective-driven attentional instability",
    "Mixed-features spectrum (BRIDGE phenotype)",
    "Internal preoccupation (OCD-spectrum)",
    "Internal preoccupation (depressive rumination)",
    "Internal preoccupation (trauma-related)",
    "Cognitive slowing / fatigue pattern",
    "Medical contributor identified",
    "Mixed / unclear",
  ];

  // Auto-suggest pattern classification chip when engine output matches a chip
  const suggestedLabel = pathwayResult ? pathwayResult.primary.label : null;
  useEffect(() => {
    if (suggestedLabel && PATTERN_CHIPS.includes(suggestedLabel) && !formulation.patternClass) {
      setFormulation(prev => ({ ...prev, patternClass: suggestedLabel }));
    }
  }, [suggestedLabel]);

  // Check if temporal section is filled (gate for interpretation)
  const temporalFilled = scores["temp_1"] != null && scores["temp_2"] != null;

  // Detail panels toggle
  const [showDetails, setShowDetails] = useState(false);

  // ── Chart text ──
  const generateClinicalNote = useCallback(() => {
    const lines = [];
    const headerParts = ["ATTENTION ASSESSMENT"];
    if (patientInfo.name) headerParts.push(patientInfo.name);
    if (patientInfo.date) headerParts.push(patientInfo.date);
    lines.push(headerParts.join(" — "));
    if (patientInfo.mrn) lines.push(`Examiner: ${patientInfo.mrn}`);
    lines.push("");

    const domainLabels = [
      ["observation", "Observation"],
      ["orientation", "Orientation"],
      ["attentional_tasks", "Tasks"],
      ["attentional_dynamics", "Dynamics"],
      ["context", "Context"],
    ];
    const domainStr = domainLabels.map(([id, label]) => {
      const v = sectionAvgs[id];
      return `${label} ${v != null ? v.toFixed(1) : "—"}`;
    }).join(" | ");

    const taskImmersion = scores["engagement_pattern"] != null && scores["engagement_pattern"] >= 4;

    if (pathwayResult) {
      const bridgeTag = pathwayResult.primary.bridgePhenotype ? " [BRIDGE phenotype]" : "";
      lines.push(`Profile: ${pathwayResult.primary.label}${bridgeTag}`);
      if (pathwayResult.modifiers.length > 0) lines.push(`Modifiers: ${pathwayResult.modifiers.join(", ")}`);
      if (taskImmersion) lines.push("Task immersion: Present (non-discriminating per Groen 2020; functional management target)");
      lines.push("");
      lines.push(`Domains: ${domainStr}`);
      lines.push("");
      lines.push(`Interpretation: ${pathwayResult.interpretation}`);
      lines.push("");
      if (pathwayResult.implication) {
        lines.push(`Implication: ${pathwayResult.implication}`);
        lines.push("");
      }
      if (pathwayResult.nextSteps && pathwayResult.nextSteps.length > 0) {
        lines.push("Next steps:");
        pathwayResult.nextSteps.forEach(st => lines.push(`• ${st}`));
        lines.push("");
      }

      const formBits = [];
      if (formulation.patternClass) formBits.push(formulation.patternClass);
      if (formulation.attribution) formBits.push(formulation.attribution);
      if (formulation.stateVsTrait) formBits.push(formulation.stateVsTrait);
      if (formBits.length > 0 || formulation.plan) {
        let formLine = `Formulation: ${formBits.join(", ")}`;
        if (formBits.length > 0) formLine += ".";
        if (formulation.plan) formLine += `${formBits.length > 0 ? " " : ""}${formulation.plan}`;
        lines.push(formLine);
        lines.push("");
      }

      if (pathwayResult.conflicts && pathwayResult.conflicts.length > 0) {
        lines.push(`Conflicts: ${pathwayResult.conflicts.map(c => `${c.label} — ${c.text}`).join("; ")}`);
        lines.push("");
      }
    } else {
      lines.push(`Domains: ${domainStr}`);
      if (taskImmersion) lines.push("Task immersion: Present (non-discriminating per Groen 2020; functional management target)");
      lines.push("");
      if (formulation.patternClass) lines.push(`Pattern: ${formulation.patternClass}`);
      if (formulation.attribution) lines.push(`Attribution: ${formulation.attribution}`);
      if (formulation.stateVsTrait) lines.push(`State vs. Trait: ${formulation.stateVsTrait}`);
      if (formulation.plan) lines.push(`Plan: ${formulation.plan}`);
      if (formulation.additionalNotes) lines.push(`Notes: ${formulation.additionalNotes}`);
      if (formulation.patternClass || formulation.attribution || formulation.stateVsTrait || formulation.plan || formulation.additionalNotes) {
        lines.push("");
      }
    }

    lines.push("Draft tool — not validated. Based on Albertella et al., Psychiatr Clin N Am (2026).");
    return lines.join("\n");
  }, [scores, patientInfo, formulation, pathwayResult, sectionAvgs]);

  const generateFullRecord = useCallback(() => {
    const lines = [];
    const hr = "─".repeat(50);
    lines.push("CLINICAL ATTENTION ASSESSMENT");
    if (patientInfo.name) lines.push(`Patient: ${patientInfo.name}`);
    if (patientInfo.date) lines.push(`Date: ${patientInfo.date}`);
    if (patientInfo.mrn) lines.push(`Examiner: ${patientInfo.mrn}`);
    lines.push("");

    // Structured pathway output
    if (pathwayResult) {
      lines.push(hr);
      let header;
      if (pathwayResult.isUrgent) header = "⚠ URGENT — ATTENTIONAL PROFILE";
      else if (pathwayResult.isMedical) header = "MEDICAL CONTRIBUTOR — ATTENTIONAL PROFILE";
      else header = "ATTENTIONAL PROFILE";
      lines.push(header);
      lines.push(hr);
      const bridgeTag = pathwayResult.primary.bridgePhenotype ? " [BRIDGE phenotype]" : "";
      lines.push(`Primary Pattern: ${pathwayResult.primary.label}${bridgeTag}`);
      if (pathwayResult.modifiers.length > 0) lines.push(`Modifiers: ${pathwayResult.modifiers.join(", ")}`);
      const hasImmersionModifier = pathwayResult.modifiers.some(m => m && m.toString().startsWith("Task immersion pattern"));
      if (hasImmersionModifier) {
        lines.push("  Note: task immersion pattern is non-discriminating per Groen 2020 — included for clinical formulation, not as a diagnostic discriminator. Functional consequences are the management target.");
      }
      lines.push("");
      lines.push("INTERPRETATION");
      lines.push(pathwayResult.interpretation);
      lines.push("");
      if (pathwayResult.implication) {
        lines.push("CLINICAL IMPLICATION");
        lines.push(pathwayResult.implication);
        lines.push("");
      }
      lines.push("NEXT STEPS");
      pathwayResult.nextSteps.forEach(s => lines.push(`• ${s}`));
      lines.push("");

      if (pathwayResult.conflicts.length > 0) {
        lines.push("CONFLICTS / WARNINGS");
        pathwayResult.conflicts.forEach(c => lines.push(`⚠ ${c.label}: ${c.text}`));
        lines.push("");
      }
    }

    lines.push(hr);
    lines.push("DOMAIN SCORES");
    lines.push(hr);
    SECTIONS.forEach(section => {
      const avg = getSectionAvg(section);
      const completion = getSectionCompletion(section);
      if (avg !== null) lines.push(`${section.title}: ${avg.toFixed(1)}/5 (${getSeverityLabel(avg)}) [${completion}]`);
      else lines.push(`${section.title}: Not rated [${completion}]`);
    });
    if (globalAvg !== null) lines.push(`Composite (reference only): ${globalAvg.toFixed(1)}/5`);
    lines.push("");

    lines.push(hr);
    lines.push("ITEM-LEVEL DETAIL");
    lines.push(hr);
    SECTIONS.forEach(section => {
      const ratedItems = section.items.filter(i => scores[i.id] != null);
      if (ratedItems.length > 0) {
        lines.push(`\n${section.title.toUpperCase()}`);
        ratedItems.forEach(item => {
          const val = scores[item.id];
          const anchor = item.anchors[val - 1] || "";
          const shortText = item.text.split("—")[0].trim();
          const autoTag = autoScores[item.id] ? ` [auto: ${TOOL_LABELS[autoScores[item.id].tool] || autoScores[item.id].tool}]` : "";
          lines.push(`  ${shortText}: ${val}/${item.anchors.length} (${anchor})${autoTag}`);
        });
      }
    });
    lines.push("");

    const hasFormulation = formulation.patternClass || formulation.attribution || formulation.plan || formulation.additionalNotes;
    if (hasFormulation) {
      lines.push(hr); lines.push("CLINICAL FORMULATION"); lines.push(hr);
      if (formulation.patternClass) lines.push(`Pattern: ${formulation.patternClass}`);
      if (formulation.attribution) lines.push(`Attribution: ${formulation.attribution}`);
      if (formulation.stateVsTrait) lines.push(`State vs. Trait: ${formulation.stateVsTrait}`);
      if (formulation.confounders) lines.push(`Confounders: ${formulation.confounders}`);
      if (formulation.plan) lines.push(`Plan: ${formulation.plan}`);
      if (formulation.additionalNotes) lines.push(`Notes: ${formulation.additionalNotes}`);
      lines.push("");
    }

    lines.push(hr);
    lines.push("Draft tool — not validated. Based on Albertella et al., Psychiatr Clin N Am (2026).");
    return lines.join("\n");
  }, [scores, patientInfo, formulation, globalAvg, pathwayResult, autoScores]);

  const writeToClipboard = async (text) => {
    try { await navigator.clipboard.writeText(text); } catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    }
  };

  const copyClinicalNote = useCallback(async () => {
    await writeToClipboard(generateClinicalNote());
    setCopyNoteStatus("Copied"); setTimeout(() => setCopyNoteStatus(""), 2000);
  }, [generateClinicalNote]);

  const copyFullRecord = useCallback(async () => {
    await writeToClipboard(generateFullRecord());
    setCopyFullStatus("Copied"); setTimeout(() => setCopyFullStatus(""), 2000);
  }, [generateFullRecord]);

  // ── Render ──
  return (
    <>
      <style>{css}</style>
      <div className="app">
        <div className="header">
          <h1>Clinical Attention Assessment</h1>
          <div className="subtitle">Based on Albertella, Lee & Fontenelle — <em>Psychiatr Clin N Am</em> (2026)</div>
          <div className="draft-badge">Draft — Not Validated</div>
          <details className="epistemic-frame">
            <summary>About this tool — phenomenology, not diagnosis</summary>
            <div className="epistemic-frame-body">
              <strong>What this tool does:</strong> characterizes the phenomenology and likely mechanisms of attentional dysfunction in the present encounter. Pattern labels (e.g., "ADHD-I consistent," "affective-driven") describe the shape of the presentation, not DSM diagnostic conclusions. The criterion-overlap problem in DSM-5-TR ADHD means apparent comorbidity with mood/anxiety conditions often reflects shared non-specific symptoms rather than true co-occurrence; this tool surfaces phenomenology to help disentangle that, but does not resolve it. <strong>On screeners:</strong> ASRS, Conners, and similar instruments are designed to cast a wide net and carry a built-in high false-positive rate. A positive screen is a reason to assess, not evidence of the diagnosis, and cannot validate one. The same limitation applies to continuous performance testing, which lacks specificity for ADHD.
            </div>
          </details>
        </div>

        <div className="patient-bar">
          <input placeholder="Patient name / ID" value={patientInfo.name} onChange={e => setPatientInfo(p => ({ ...p, name: e.target.value }))} />
          <input placeholder="Date of assessment" value={patientInfo.date} onChange={e => setPatientInfo(p => ({ ...p, date: e.target.value }))} />
          <input placeholder="Examiner" value={patientInfo.mrn} onChange={e => setPatientInfo(p => ({ ...p, mrn: e.target.value }))} />
        </div>

        {SECTIONS.map(section => {
          const avg = getSectionAvg(section);
          const isOpen = openSections[section.id];
          return (
            <div className="section" key={section.id}>
              <div className="section-header" onClick={() => toggleSection(section.id)}>
                <div>
                  <h2>{section.title}</h2>
                  <div className="section-sub">{section.subtitle} — {getSectionCompletion(section)} rated</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {avg !== null && <span className="section-score" style={{ background: getSeverityColor(avg) }}>{avg.toFixed(1)} — {getSeverityLabel(avg)}</span>}
                  <span className={`chevron ${isOpen ? "open" : ""}`}>▼</span>
                </div>
              </div>
              {isOpen && (
                <>
                  <div className="section-instructions">{section.instructions}</div>
                  {section.id === 'attentional_tasks' && (
                    <div className="tool-bar">
                      <span className="tool-bar-label">Bedside tools:</span>
                      <button className="tool-launch-btn" onClick={() => openTool('finger_counting_admin.html')}>Finger Count</button>
                      <button className="tool-launch-btn" onClick={() => openTool('digit_span_admin.html')}>Digit Span</button>
                      <button className="tool-launch-btn" onClick={() => openTool('cpt_admin.html')}>CPT</button>
                      <button className="tool-launch-btn" onClick={() => openTool('serial_subtraction_admin.html')}>Serial Subtraction</button>
                      <button className="tool-launch-btn" onClick={() => openTool('months_backward_admin.html')}>Months Backward</button>
                      <span className="tool-bar-divider">|</span>
                      <button className="tool-paste-btn" onClick={pasteResults}>{pasteStatus || 'Paste results'}</button>
                    </div>
                  )}
                  <div className="section-body">
                    {section.items.map(item => {
                      const autoInfo = autoScores[item.id];
                      return (
                        <div className={`item ${autoInfo ? 'item-auto' : ''}`} key={item.id}>
                          <div className="item-text-row">
                            <div className="item-text">{item.text}</div>
                            {autoInfo && <span className="auto-badge" title={`Set by ${TOOL_LABELS[autoInfo.tool] || autoInfo.tool} at ${autoInfo.timestamp}. Click any anchor to override.`}>← {TOOL_LABELS[autoInfo.tool] || autoInfo.tool}</span>}
                          </div>
                          {item.administration && (
                            <details className="admin-details">
                              <summary className="admin-summary">How to administer</summary>
                              <div className="admin-body">{item.administration}</div>
                            </details>
                          )}
                          <div className="rating-row">
                            {item.anchors.map((anchor, idx) => {
                              const val = idx + 1;
                              const isSelected = scores[item.id] === val;
                              const isAutoSelected = isSelected && autoInfo;
                              return (
                                <button key={idx} className={`rating-btn ${isSelected ? "selected" : ""} ${isAutoSelected ? "auto-selected" : ""}`}
                                  onClick={() => {
                                    setScore(item.id, val);
                                    if (autoInfo && scores[item.id] !== val) setAutoScores(prev => { const n = { ...prev }; delete n[item.id]; return n; });
                                  }}>
                                  <div><span className="score-num">{val}</span>{anchor}</div>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          );
        })}

        {/* ══════════ CLINICAL SUMMARY ══════════ */}
        <div className="summary-section">
          <div className="summary-header"><h2>Clinical Summary</h2></div>
          <div className="summary-body">

            {/* ── Structured Diagnostic Output ── */}
            {pathwayResult ? (
              <div className={`dx-output ${pathwayResult.isUrgent ? 'urgent' : ''}`}>
                <div className="dx-output-header">
                  <h3>{pathwayResult.isUrgent ? '⚠ URGENT — Attentional Profile' : 'Attentional Profile'}</h3>
                </div>
                <div className="dx-output-body">
                  <div className="dx-section">
                    <div className="dx-section-label">Primary Pattern</div>
                    <div className="dx-primary">{pathwayResult.primary.label}</div>
                  </div>

                  {pathwayResult.modifiers.length > 0 && (
                    <div className="dx-section">
                      <div className="dx-section-label">Modifiers</div>
                      <div className="dx-modifiers">
                        {pathwayResult.modifiers.map((m, i) => <span className="dx-modifier" key={i}>{m}</span>)}
                      </div>
                    </div>
                  )}

                  <div className="dx-section">
                    <div className="dx-section-label">Interpretation</div>
                    <div className="dx-interpretation">{pathwayResult.interpretation}</div>
                  </div>

                  {pathwayResult.implication && (
                    <div className="dx-section">
                      <div className="dx-section-label">Clinical Implication</div>
                      <div className="dx-implication">{pathwayResult.implication}</div>
                    </div>
                  )}

                  <div className="dx-section">
                    <div className="dx-section-label">{pathwayResult.isUrgent ? 'Immediate Next Steps' : 'Diagnostic Pathway — Next Steps'}</div>
                    <ul className="dx-steps">
                      {pathwayResult.nextSteps.map((s, i) => <li key={i}>{s}</li>)}
                    </ul>
                  </div>

                  {/* Conflicts */}
                  {pathwayResult.conflicts.map((c, i) => (
                    <div className="dx-conflict" key={i}>
                      <div className="dx-conflict-title">⚠ {c.label}</div>
                      <div className="dx-conflict-text">{c.text}</div>
                    </div>
                  ))}

                  {/* Runner-up pathway */}
                  {pathwayResult.runner && (
                    <div className="dx-runner">
                      <strong>Alternative pathway:</strong> {pathwayResult.runner.label} ({pathwayResult.runner.met}/{pathwayResult.runner.total} criteria met: {pathwayResult.runner.criteria.join(", ")})
                    </div>
                  )}

                </div>
              </div>
            ) : (
              <div className="narrative-profile" style={{ borderColor: 'var(--c-border)', background: 'var(--c-bg)' }}>
                <div className="profile-label" style={{ color: 'var(--c-text-muted)' }}>Attentional Profile</div>
                <div className="profile-text" style={{ color: 'var(--c-text-muted)', fontWeight: 400, fontSize: '0.85rem' }}>
                  Complete at least: temporal course (temp_1), 2 observation items, and 3 dynamics items to enable the diagnostic engine.
                </div>
              </div>
            )}

            {/* Domain scores */}
            <div className="summary-grid">
              {SECTIONS.filter(s => SCORED_DOMAINS.includes(s.id)).map(section => {
                const avg = getSectionAvg(section);
                return (
                  <div className="summary-card" key={section.id}>
                    <div className="card-label">{section.title}</div>
                    <div className="card-score" style={{ color: getSeverityColor(avg) }}>{avg !== null ? avg.toFixed(1) : "—"}</div>
                    <div className="card-severity" style={{ color: getSeverityColor(avg) }}>{getSeverityLabel(avg)}</div>
                  </div>
                );
              })}
            </div>
            {globalAvg !== null && <div className="composite-footnote">Composite (unweighted reference): {globalAvg.toFixed(1)}/5 — {getSeverityLabel(globalAvg)}. The structured pathway output above is the primary clinical output.</div>}

            {/* Detail panels — collapsed by default */}
            <button className="detail-toggle" onClick={() => setShowDetails(prev => !prev)}>
              {showDetails ? '▾ Hide detail panels' : '▸ Show detail panels (tenacity-vigilance, capture, phenomenology, hot EF, metacognition)'}
            </button>

            {showDetails && (
              <>
                {/* Tenacity-vigilance */}
                {tvPattern && (
                  <div className={`interp-panel interp-tv interp-tv-${tvPattern.severity}`}>
                    <div className="interp-header"><span className="interp-icon">🔀</span><strong>Tenacity–Vigilance: {tvPattern.label}</strong></div>
                    <div className="interp-body">
                      <p><strong>Pattern:</strong> {tvPattern.description}</p>
                      <p><strong>Context:</strong> {tvPattern.clinicalContext}</p>
                      <p><strong>Differentials:</strong> {tvPattern.differentials}</p>
                      <p><strong>Next steps:</strong> {tvPattern.nextSteps}</p>
                    </div>
                  </div>
                )}

                {/* Attentional capture */}
                {scores["dyn_capture"] != null && (
                  <div className="interp-panel interp-capture">
                    <div className="interp-header"><span className="interp-icon">🎯</span><strong>Source of Attentional Capture</strong></div>
                    <div className="interp-body">
                      {scores["dyn_capture"] === 1 && <p><strong>External stimuli</strong> — classic distractibility. Attention involuntarily captured by environmental inputs.</p>}
                      {scores["dyn_capture"] === 2 && <p><strong>Internal thoughts</strong> — attentional depolarization. Consumed by obsessions, rumination, worry, or delusional material.</p>}
                      {scores["dyn_capture"] === 3 && <p><strong>Emotional states</strong> — affect itself disrupts processing. Cognitive system overwhelmed by emotional arousal.</p>}
                      {scores["dyn_capture"] === 4 && <p><strong>Task avoidance</strong> — selective disengagement from aversive/low-reward tasks. CAN focus, but selectively doesn't.</p>}
                      {scores["dyn_capture"] === 5 && <p><strong>Mixed/unclear</strong> — source doesn't fall cleanly into one category.</p>}
                    </div>
                  </div>
                )}

                {/* Phenomenology */}
                {scores["dyn_phenom"] != null && scores["dyn_phenom"] <= 6 && (
                  <div className="interp-panel interp-phenomenology">
                    <div className="interp-header"><span className="interp-icon">💭</span><strong>Subjective Attentional Experience</strong></div>
                    <div className="interp-body">
                      {scores["dyn_phenom"] === 1 && <p><strong>Foggy / slowed</strong> — cognitive dulling. Associated with delirium, depression, medication effects, fatigue.</p>}
                      {scores["dyn_phenom"] === 2 && <p><strong>Scattered / externally pulled</strong> — attention fragmented by environment. ADHD, anxiety, hyperactive delirium.</p>}
                      {scores["dyn_phenom"] === 3 && <p><strong>Crowded</strong> — too many competing thoughts. OCD, GAD, PTSD, psychosis spectrum.</p>}
                      {scores["dyn_phenom"] === 4 && <p><strong>Racing</strong> — accelerated, pressured thinking. Mania/hypomania, stimulant effects, severe anxiety.</p>}
                      {scores["dyn_phenom"] === 5 && <p><strong>Blank / disengaged</strong> — empty attentional field. Depression, dissociation, apathy syndromes.</p>}
                      {scores["dyn_phenom"] === 6 && <p><strong>Overcontrolled</strong> — resources consumed by regulation itself. Social anxiety, OCPD, perfectionism.</p>}
                    </div>
                  </div>
                )}

                {/* Hot EF */}
                {scores["dyn_8"] != null && scores["dyn_8"] <= 3 && (
                  <div className="interp-panel interp-hotef">
                    <div className="interp-header"><span className="interp-icon">🔥</span><strong>Hot Executive Function</strong></div>
                    <div className="interp-body">
                      <p>{scores["dyn_8"] <= 1 ? "Severe" : scores["dyn_8"] <= 2 ? "Significant" : "Mild"} difficulty with self-regulation in emotionally charged contexts.</p>
                    </div>
                  </div>
                )}

                {/* Metacognitive accuracy */}
                {scores["dyn_9"] != null && scores["dyn_9"] !== 3 && (
                  <div className="interp-panel interp-metacog">
                    <div className="interp-header"><span className="interp-icon">🪞</span><strong>Metacognitive {scores["dyn_9"] <= 2 ? "Overconfidence" : "Underconfidence"}</strong></div>
                    <div className="interp-body">
                      {scores["dyn_9"] <= 2
                        ? <p>Self-assessment more positive than observed. Under-uses compensatory strategies.</p>
                        : <p>Self-reported impairment exceeds objective findings. Common in depression/anxiety.</p>
                      }
                    </div>
                  </div>
                )}
              </>
            )}

            {/* ══════════ PATTERN CLASSIFICATION (auto-suggested, overridable) ══════════ */}
            <div className="gate-section">
              <div className="gate-title">Pattern Classification {pathwayResult ? '(auto-suggested — override if needed)' : '(manual)'}</div>
              <div className="gate-hint">
                {pathwayResult
                  ? `The pathway engine suggests: "${pathwayResult.primary.label}". You can accept this or select a different classification.`
                  : 'Complete more items to enable the pathway engine, or select manually.'}
              </div>
              {!temporalFilled && <div className="gate-required" style={{ marginBottom: 8 }}>Complete the Temporal Pattern section for best results.</div>}
              <div className="form-options">
                {PATTERN_CHIPS.map(opt => (
                  <button key={opt}
                    className={`form-chip ${formulation.patternClass === opt ? "form-chip-active" : ""}`}
                    onClick={() => updateFormulation("patternClass", formulation.patternClass === opt ? "" : opt)}>
                    {opt}
                  </button>
                ))}
              </div>
            </div>

            {/* ══════════ FORMULATION ══════════ */}
            {!formulation.patternClass ? (
              <div className="formulation-locked">
                Select a pattern classification above to unlock the formulation section.
              </div>
            ) : (
              <div className="formulation-section">
                <div className="formulation-title">Clinical Formulation</div>

                <div className="form-field">
                  <label className="form-label">Primary Attribution <span className="form-hint">Given the pattern, what is the most likely source?</span></label>
                  <div className="form-options">
                    {["ADHD-pattern / neurodevelopmental", "Depressive / mood-related", "Anxiety / OCD-driven", "Delirium / organic", "Substance-related", "Neurocognitive decline", "Comorbid / multifactorial", "Insufficient data"].map(opt => (
                      <button key={opt} className={`form-chip ${formulation.attribution === opt ? "form-chip-active" : ""}`}
                        onClick={() => updateFormulation("attribution", formulation.attribution === opt ? "" : opt)}>{opt}</button>
                    ))}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label">State vs. Trait</label>
                  <div className="form-options">
                    {["Acute state — likely reversible", "Subacute — unclear trajectory", "Chronic trait — baseline", "Acute exacerbation of chronic trait", "Cannot determine"].map(opt => (
                      <button key={opt} className={`form-chip ${formulation.stateVsTrait === opt ? "form-chip-active" : ""}`}
                        onClick={() => updateFormulation("stateVsTrait", formulation.stateVsTrait === opt ? "" : opt)}>{opt}</button>
                    ))}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label">Confounders</label>
                  <div className="form-options">
                    {["Sleep deprivation", "Acute stress", "Medication effects", "Substance use", "Pain", "Test anxiety / effort", "Language barrier", "None significant"].map(opt => {
                      const selected = (formulation.confounders || "").includes(opt);
                      return (
                        <button key={opt} className={`form-chip ${selected ? "form-chip-active" : ""}`}
                          onClick={() => {
                            const current = formulation.confounders || "";
                            if (opt === "None significant") { updateFormulation("confounders", selected ? "" : opt); }
                            else {
                              const cleaned = current.replace("None significant", "").trim();
                              const items = cleaned ? cleaned.split(", ").filter(Boolean) : [];
                              updateFormulation("confounders", selected ? items.filter(i => i !== opt).join(", ") : [...items, opt].join(", "));
                            }
                          }}>{opt}</button>
                      );
                    })}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label">Plan</label>
                  <div className="form-options">
                    {["Formal neuropsych referral", "Delirium workup (CAM, labs, EEG)", "Medication review / anticholinergic audit", "Sleep intervention", "Treat underlying mood/anxiety", "ADHD-specific evaluation", "Longitudinal attentional monitoring", "Collateral history needed", "No further workup indicated"].map(opt => {
                      const selected = (formulation.plan || "").includes(opt);
                      return (
                        <button key={opt} className={`form-chip ${selected ? "form-chip-active" : ""}`}
                          onClick={() => {
                            const current = formulation.plan || "";
                            if (opt === "No further workup indicated") { updateFormulation("plan", selected ? "" : opt); }
                            else {
                              const cleaned = current.replace("No further workup indicated", "").trim();
                              const items = cleaned ? cleaned.split(", ").filter(Boolean) : [];
                              updateFormulation("plan", selected ? items.filter(i => i !== opt).join(", ") : [...items, opt].join(", "));
                            }
                          }}>{opt}</button>
                      );
                    })}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label">Additional Notes</label>
                  <textarea className="form-textarea" value={formulation.additionalNotes} onChange={e => updateFormulation("additionalNotes", e.target.value)} placeholder="Free text..." />
                </div>
              </div>
            )}

            <div className="action-bar">
              <button className="btn btn-primary" onClick={copyClinicalNote}>{copyNoteStatus || "Copy for Chart"}</button>
              <button className="btn btn-secondary" onClick={copyFullRecord}>{copyFullStatus || "Copy Full Record"}</button>
              <button className="btn btn-secondary" onClick={resetAll}>Reset All</button>
            </div>

            <div className="citation">
              Derived from: Albertella L, Lee RSC, Fontenelle LF. Attention and Its Symptoms. <em>Psychiatr Clin N Am.</em> 2026.<br/>
              Pathway logic informed by: Vannucchi et al. (2019) BRIDGE-II-Mix, <em>J Affect Disord</em>; Wilens et al. (2003) <em>Biol Psychiatry</em>; Bertschy et al. (2023) <em>Neuropsychiatr Dis Treat</em>; Comparelli et al. (2022) <em>Front Psychiatry</em>.<br/>
              Engagement-pattern item informed by Groen et al. (2020) <em>Res Dev Disabil</em> 107:103789 and Ayers-Glassey & Smilek (2024) <em>Curr Psychol</em> 43:11254. Per case-control evidence, this pattern is non-discriminating for ADHD; the item is included for clinical formulation and not used in pathway scoring.<br/>
              <strong>Task non-specificity:</strong> Grant JE, Chamberlain SR. Attentional problems occur across multiple psychiatric disorders and are not specific for ADHD. <em>CNS Spectr</em> 2023;28(3):357–60. <strong>Diagnostic-practice caveats</strong> (stimulant response, screener false-positive rates, retrospective recall bias): Paris J, Bhat V, Thombs B. Is adult ADHD being overdiagnosed? <em>Can J Psychiatry</em> 2015;60(7):324–8.<br/>
              <strong>Criterion-overlap caveat (Szymaniak et al. 2026):</strong> DSM-5-TR ADHD criteria are non-specific — inattention, restlessness, and impulsivity appear across mood, anxiety, substance, and neurocognitive conditions. Frequently-cited comorbidity rates (e.g., the ~3× elevation of ADHD in mood disorders per Sandstrom 2021) likely overstate true co-occurrence because the same underlying disturbance can meet symptom thresholds for multiple categories. When an attentional complaint accompanies an active mood, anxiety, or substance condition, treating the primary condition first — and reassessing attention after — is generally more diagnostically informative than concurrent ADHD attribution. This tool's pathway engine attempts to surface mechanism-level differences (capture source, phenomenology, affective coupling, trajectory) precisely to address this overlap, but it cannot resolve it.<br/>
              <strong>Draft clinical tool — not validated. Observation-based assessment should carry more interpretive weight than structured tasks per the source framework.</strong>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AttentionAssessment));
</script>
</body>
</html>
