function getSeverityColor(score) {
  if (score === null) return "var(--c-border)";
  if (score <= 1) return "#c0392b";
  if (score <= 2) return "#e67e22";
  if (score <= 3) return "#f1c40f";
  if (score <= 4) return "#27ae60";
  return "#2980b9";
}

function getSeverityLabel(score) {
  if (score === null) return "—";
  if (score <= 1) return "Severe";
  if (score <= 2) return "Moderate";
  if (score <= 3) return "Mild";
  if (score <= 4) return "Normal";
  return "Intact";
}

// Weighted scoring helper
const scorePathway = (criteria) => {
  let score = 0;
  let anchorMet = false;
  const met = [];
  for (const c of criteria) {
    if (c.met) {
      score += c.weight;
      met.push(c.label);
      if (c.tier === 'anchor') anchorMet = true;
    }
  }
  return { score, anchorMet, met };
};

const buildCriterion = (label, met, tier) => {
  const weights = { anchor: 3, supporting: 2, consistent: 1 };
  return { label, met, tier, weight: weights[tier] };
};

function evaluatePathways(scores, sectionAvgs) {
  const s = (id) => scores[id];
  const obsAvg = sectionAvgs.observation;
  const oriAvg = sectionAvgs.orientation;
  const taskAvg = sectionAvgs.attentional_tasks;

  // ── Computed features ──
  const lowVar = (s("var_1") != null && s("var_1") <= 2) && (s("var_2") == null || s("var_2") <= 2);
  const highVar = (s("var_1") != null && s("var_1") >= 3) || (s("var_2") != null && s("var_2") >= 3);
  const markedFluctuation = s("var_1") != null && s("var_1") >= 4;
  const crossContext = s("temp_3") != null && s("temp_3") >= 4;
  const contextDependent = s("temp_2") != null && s("temp_2") >= 4;
  const stablePattern = s("temp_1") != null && s("temp_1") <= 2;
  const acuteOnset = s("temp_1") != null && s("temp_1") >= 4;

  // Trajectory
  const traj = s("temp_4");
  const homotypicTrait = traj === 1;
  const heterotypicTraj = traj === 2;

  // Engagement pattern (modifier only — does NOT feed pathway scoring)
  const taskImmersion = s("engagement_pattern") != null && s("engagement_pattern") >= 4;

  // Capture / phenomenology / affect
  const externalCapture = s("dyn_capture") === 1;
  const internalCapture = s("dyn_capture") === 2;
  const emotionalCapture = s("dyn_capture") === 3;
  const taskAvoidance = s("dyn_capture") === 4;
  const weakAffect = s("dyn_affect") === 5;
  const strongAffect = s("dyn_affect") != null && s("dyn_affect") <= 4;
  const affectType = s("dyn_affect");
  const foggySlowed = s("dyn_phenom") === 1;
  const scattered = s("dyn_phenom") === 2;
  const crowded = s("dyn_phenom") === 3;
  const racing = s("dyn_phenom") === 4;
  const blank = s("dyn_phenom") === 5;
  const overcontrolled = s("dyn_phenom") === 6;

  // Subtype
  const inattentiveSubtype = s("dyn_subtype") != null && s("dyn_subtype") <= 2;
  const combinedSubtype = s("dyn_subtype") != null && s("dyn_subtype") >= 4;

  // Content
  const content = s("dyn_content");
  const contentRumination = content === 1;
  const contentIntrusion = content === 2;
  const contentTrauma = content === 3;
  const contentBizarre = content === 4;

  // Tenacity / vigilance
  const lowTenacity = s("dyn_1") != null && s("dyn_1") <= 2;
  const lowVigilance = s("dyn_2") != null && s("dyn_2") <= 2;
  const reducedTenacity = s("dyn_1") != null && s("dyn_1") <= 2;

  // Performance
  const timeOnTaskDecline = s("ctx_5") != null && s("ctx_5") <= 2;
  const perplexity = s("obs_6") != null && s("obs_6") <= 2;

  const hasMedMimic = medMimic != null && medMimic >= 1 && medMimic <= 4;

  // ════════════════════════════════════════════════
  // LAYER 1 — Urgent gates
  // ════════════════════════════════════════════════

  // ── Pathway F: Delirium (revised — fluctuation-aware) ──
  const pathF = { id: 'F', label: 'Delirium / Acute Confusional State', criteria: [] };
  pathF.criteria.push(buildCriterion('Acute onset', acuteOnset, 'anchor'));
  pathF.criteria.push(buildCriterion('Marked within-session fluctuation', markedFluctuation, 'anchor'));
  pathF.criteria.push(buildCriterion('Global tenacity+vigilance collapse', lowTenacity && lowVigilance, 'supporting'));
  pathF.criteria.push(buildCriterion('Disorientation', disorientation, 'supporting'));
  pathF.criteria.push(buildCriterion('Perplexity', perplexity, 'supporting'));
  pathF.criteria.push(buildCriterion('Foggy/slowed phenomenology', foggySlowed, 'consistent'));
  pathF.criteria.push(buildCriterion('Time-on-task decline', timeOnTaskDecline, 'consistent'));

  const fScore = scorePathway(pathF.criteria);

  if (fScore.anchorMet && fScore.score >= 5) {
    return {
      primary: { id: 'F', label: pathF.label, met: fScore.met.length, total: pathF.criteria.length, criteria: fScore.met },
      isUrgent: true,
      interpretation: "Pattern consistent with disturbance of consciousness (delirium until proven otherwise). The combination of acute onset and/or marked fluctuation with attentional, perceptual, or orientation features has high specificity for an organic confusional state. Fluctuation is the cardinal feature — single-snapshot orientation testing can miss hyperactive or rapidly-cycling delirium.",
      nextSteps: [
        "Immediate medical workup: metabolic panel, CBC, UA, vitals, O2 sat",
        "Formal delirium screening (CAM, 4AT, or DRS-R-98)",
        "Medication review — anticholinergic burden, recent additions",
        "Document fluctuating course (serial assessments over hours)",
        "Do NOT attribute to psychiatric diagnosis without ruling out delirium first",
      ],
      implication: "All other diagnostic considerations are deferred until delirium is excluded.",
      conflicts: [],
      modifiers: fScore.met,
    };
  }

  // ── Pathway G: Medical mimic ──
  if (hasMedMimic) {
    const mimicLabels = {
      1: 'OSA features identified',
      2: 'Thyroid status unknown/abnormal',
      3: 'Recent hormonal transition',
      4: 'Post-viral cognitive symptoms',
    };
    const mimicNextSteps = {
      1: ['Sleep study referral (STOP-BANG screen first)', 'CPAP if indicated — many "ADHD" cases resolve with treated OSA', 'Defer psychiatric attribution pending sleep workup'],
      2: ['TSH, free T4, anti-TPO antibodies', 'Treat to euthyroid before attentional diagnosis', 'Both hyper- and hypothyroidism produce attentional symptoms'],
      3: ['Hormonal panel as indicated', 'Consider HRT consultation', 'Estrogen withdrawal removes dopaminergic scaffolding — may unmask latent ADHD or produce de novo symptoms'],
      4: ['Neurological consultation if symptoms persistent', 'Long COVID screen', 'Symptoms typically improve over months — serial reassessment'],
    };
    return {
      primary: { id: 'G', label: 'Medical contributor identified', met: 1, total: 1, criteria: [mimicLabels[medMimic]] },
      isUrgent: false,
      isMedical: true,
      interpretation: `${mimicLabels[medMimic]}. A medical contributor to attentional symptoms has been identified that requires workup before psychiatric attribution. Cognitive symptoms in this context may resolve fully with treatment of the underlying medical condition; diagnosing a primary psychiatric attentional disorder before this is addressed risks both mistreatment and delayed resolution of the actual cause.`,
      nextSteps: mimicNextSteps[medMimic] || [],
      implication: 'Primary attentional diagnosis should be deferred pending medical workup.',
      conflicts: [],
      modifiers: [mimicLabels[medMimic]],
    };
  }

  // ════════════════════════════════════════════════
  // LAYER 2 — Phenotype pathways (weighted)
  // ════════════════════════════════════════════════

  const pathways = [];

  // ── Pathway A-I: ADHD Inattentive ──
  // NOTE: engagement_pattern (taskImmersion) is intentionally NOT a criterion here.
  // Per Groen 2020, hyperfocus-pattern is non-discriminating in case-control comparisons.
  const pathAI = { id: 'A-I', label: 'Stable trait inattentive pattern (ADHD-I consistent)', criteria: [] };
  pathAI.criteria.push(buildCriterion('Stable/lifelong course', stablePattern, 'supporting'));
  pathAI.criteria.push(buildCriterion('Cross-context impairment', crossContext, 'anchor'));
  pathAI.criteria.push(buildCriterion('Predominantly inattentive subtype', inattentiveSubtype, 'supporting'));
  pathAI.criteria.push(buildCriterion('Weak affective coupling', weakAffect, 'supporting'));
  pathAI.criteria.push(buildCriterion('Low variability', lowVar, 'supporting'));
  pathAI.criteria.push(buildCriterion('Homotypic trajectory (childhood → adult ADHD)', homotypicTrait, 'supporting'));
  pathAI.criteria.push(buildCriterion('External distractibility or task avoidance', externalCapture || taskAvoidance, 'consistent'));
  const aiScore = scorePathway(pathAI.criteria);
  if (aiScore.anchorMet) {
    pathways.push({ ...pathAI, score: aiScore.score, met: aiScore.met.length, total: pathAI.criteria.length, criteria: aiScore.met });
  }

  // ── Pathway A-C: ADHD Combined ──
  // NOTE: engagement_pattern is intentionally NOT a criterion here either.
  const pathAC = { id: 'A-C', label: 'Stable trait combined pattern (ADHD-C consistent)', criteria: [] };
  pathAC.criteria.push(buildCriterion('Stable/lifelong course', stablePattern, 'supporting'));
  pathAC.criteria.push(buildCriterion('Cross-context impairment', crossContext, 'anchor'));
  pathAC.criteria.push(buildCriterion('Combined subtype (prominent H/I)', combinedSubtype, 'anchor'));
  pathAC.criteria.push(buildCriterion('Racing thoughts (ADHD-pattern)', racing && !lowEnergy, 'supporting'));
  pathAC.criteria.push(buildCriterion('Emotional dysregulation', strongAffect && (affectType === 2 || affectType === 3), 'supporting'));
  pathAC.criteria.push(buildCriterion('Homotypic trajectory', homotypicTrait, 'supporting'));
  pathAC.criteria.push(buildCriterion('External capture or impulsivity', externalCapture, 'consistent'));
  const acScore = scorePathway(pathAC.criteria);
  if (acScore.anchorMet) {
    pathways.push({ ...pathAC, score: acScore.score, met: acScore.met.length, total: pathAC.criteria.length, criteria: acScore.met });
  }

  // ── Pathway B: State-dependent ──
  const pathB = { id: 'B', label: 'State-dependent attentional impairment', criteria: [] };
  pathB.criteria.push(buildCriterion('High variability', highVar, 'anchor'));
  pathB.criteria.push(buildCriterion('Strong context dependence', contextDependent, 'anchor'));
  pathB.criteria.push(buildCriterion('Time-on-task decline', timeOnTaskDecline, 'supporting'));
  pathB.criteria.push(buildCriterion('Sleep sensitivity', s("var_3") != null && s("var_3") >= 3, 'supporting'));
  pathB.criteria.push(buildCriterion('Stress sensitivity', s("var_4") != null && s("var_4") >= 3, 'supporting'));
  pathB.criteria.push(buildCriterion('Identifiable triggers', s("ctx_triggers") != null && s("ctx_triggers") >= 2 && s("ctx_triggers") <= 6, 'consistent'));
  const bScore = scorePathway(pathB.criteria);
  if (bScore.anchorMet) {
    pathways.push({ ...pathB, score: bScore.score, met: bScore.met.length, total: pathB.criteria.length, criteria: bScore.met });
  }

  // ── Pathway C: Affective-driven ──
  const pathC = { id: 'C', label: 'Affective-driven attentional instability', criteria: [] };
  pathC.criteria.push(buildCriterion('Strong affective coupling', strongAffect, 'anchor'));
  pathC.criteria.push(buildCriterion('Emotional/internal capture', emotionalCapture || internalCapture, 'supporting'));
  pathC.criteria.push(buildCriterion('High variability tracking mood', highVar, 'supporting'));
  pathC.criteria.push(buildCriterion('Phenomenology consistent with affect', (lowEnergy && (foggySlowed || blank)) || (affectType === 2 && (racing || scattered)) || (affectType === 4 && racing), 'supporting'));
  pathC.criteria.push(buildCriterion('Heterotypic trajectory', heterotypicTraj, 'consistent'));
  const cScore = scorePathway(pathC.criteria);
  if (cScore.anchorMet) {
    pathways.push({ ...pathC, score: cScore.score, met: cScore.met.length, total: pathC.criteria.length, criteria: cScore.met });
  }

  // ── Pathway D: Internal preoccupation (content-aware) ──
  const pathD = { id: 'D', label: 'Internal preoccupation pattern', criteria: [] };
  pathD.criteria.push(buildCriterion('Internal capture dominant', internalCapture, 'anchor'));
  pathD.criteria.push(buildCriterion('Preserved structured-task performance', preservedTasks, 'supporting'));
  pathD.criteria.push(buildCriterion('Crowded or overcontrolled phenomenology', crowded || overcontrolled, 'supporting'));
  pathD.criteria.push(buildCriterion('Identifiable internal content', content != null && content >= 1 && content <= 4, 'consistent'));
  const dScore = scorePathway(pathD.criteria);

    else if (contentRumination && lowEnergy) subLabel = 'Internal preoccupation (depressive rumination)';
    else if (contentTrauma) subLabel = 'Internal preoccupation (trauma-related)';
    else if (contentBizarre) subLabel = 'Internal preoccupation — bizarre/grandiose content (psychosis spectrum)';
    pathways.push({ ...pathD, label: subLabel, score: dScore.score, met: dScore.met.length, total: pathD.criteria.length, criteria: dScore.met, contentBranch: content });
  }

  // ── Pathway E: Cognitive slowing / fatigue ──
  const pathE = { id: 'E', label: 'Cognitive slowing / fatigue pattern', criteria: [] };
  pathE.criteria.push(buildCriterion('Foggy/slowed or blank phenomenology', foggySlowed || blank, 'anchor'));
  pathE.criteria.push(buildCriterion('Low-energy affect', lowEnergy, 'supporting'));
  pathE.criteria.push(buildCriterion('Reduced tenacity', reducedTenacity, 'supporting'));
  pathE.criteria.push(buildCriterion('Low variability (uniform impairment)', lowVar, 'supporting'));
  const eScore = scorePathway(pathE.criteria);
  if (eScore.anchorMet) {
    pathways.push({ ...pathE, score: eScore.score, met: eScore.met.length, total: pathE.criteria.length, criteria: eScore.met });
  }

  if (pathways.length === 0) {
    return null;
  }

  pathways.sort((a, b) => b.score - a.score);
  const primary = pathways[0];
  const runner = pathways[1] || null;

  // ════════════════════════════════════════════════
  // LAYER 3 — BRIDGE branch and interpretation
  // ════════════════════════════════════════════════

  const mixedFeaturesRisk = (
    affectType === 3 &&
    highVar &&
    stablePattern &&
    (racing || crowded)
  );

  if (primary.id === 'C' && mixedFeaturesRisk) {
    primary.label = 'Mixed-features spectrum (BRIDGE phenotype)';
    primary.bridgePhenotype = true;
  }

  // ── Build interpretation ──
  const sleepSensitive = s("var_3") != null && s("var_3") >= 3;
  const stressSensitive = s("var_4") != null && s("var_4") >= 3;
  const runnerNearMiss = runner && runner.score >= 5;
  const joinList = (arr, max) => {
    let items = arr.filter(Boolean);
    if (max) items = items.slice(0, max);
    if (items.length === 0) return '';
    if (items.length === 1) return items[0];
    if (items.length === 2) return `${items[0]} and ${items[1]}`;
    return `${items.slice(0, -1).join(', ')}, and ${items[items.length - 1]}`;
  };

  const buildInterpretation = (p) => {
    const id = p.id;

    if (id === 'A-I') {
      const findings = joinList([
        stablePattern && 'a stable, lifelong course',
        crossContext && 'impairment that crosses settings',
        inattentiveSubtype && 'a predominantly inattentive presentation (no prominent hyperactivity)',
        weakAffect && 'attention that does not track mood state',
        lowVar && 'low intra- and inter-session variability',
        homotypicTrait && 'a homotypic developmental trajectory (childhood → adult ADHD)',
      ], 4);
      const preservedNote = preservedTasks
        ? ' Structured tasks remain relatively preserved, consistent with ADHD\'s typical dissociation between coercive testing and naturalistic functioning.'
        : '';
      const overlapNote = ' The inattentive presentation has notably less overlap with mood-spectrum cognition than the combined subtype, simplifying the differential.';
      return `Findings most consistent with a trait inattentive ADHD-pattern (ADHD-I). The conclusion rests on ${findings || 'the configuration of trait inattentive features'}, with the characteristic signature being lifelong inattention combined with weak affective coupling.${preservedNote}${overlapNote}`;
    }

    if (id === 'A-C') {
      const findings = joinList([
        stablePattern && 'a stable, lifelong course',
        crossContext && 'cross-context impairment',
        combinedSubtype && 'prominent hyperactivity/impulsivity beyond inattention',
        homotypicTrait && 'a homotypic developmental trajectory',
      ], 4);
      const racingNote = racing
        ? ' Racing thoughts are present; per Bertschy et al. (2023) the lexical signature of ADHD-pattern racing (semantic wandering across distant concepts) differs from hypomanic racing (phonemic clustering), but this is hard to detect at bedside — collateral and longitudinal data are essential. Racing thoughts in this context are NOT pathognomonic of bipolarity.'
        : '';
      const overlapNote = ' Per Wilens et al. (2003) and Bertschy et al. (2023), combined-type ADHD shares substantial cognitive and behavioral overlap with mood-spectrum disorders — bipolarity screening is essential before stimulant treatment.';
      return `Findings most consistent with a trait combined-type ADHD-pattern (ADHD-C). Findings include ${findings || 'the trait combined configuration described above'}.${racingNote}${overlapNote}`;
    }

    if (id === 'B') {
      const drivers = [];
      if (sleepSensitive) drivers.push('sleep');
      if (stressSensitive) drivers.push('acute stress');
      if (timeOnTaskDecline) drivers.push('sustained effort (time-on-task decline)');
      if (contextDependent) drivers.push('environmental context');
      const driverPhrase = drivers.length ? joinList(drivers) : 'identifiable state factors';
      const varNote = highVar
        ? ' The marked variability indicates a system that can attend when conditions allow, which is incompatible with a fixed trait deficit.'
        : '';
      return `Pattern most consistent with state-dependent attentional impairment, with the principal driver(s) appearing to be ${driverPhrase}.${varNote} A fixed deficit is unlikely; addressing the modifiable factor(s) and reassessing should precede any trait diagnosis.`;
    }

    if (id === 'C' && p.bridgePhenotype) {
      return `Pattern consistent with a mixed-features spectrum presentation per the BRIDGE-II-Mix framework (Vannucchi et al., 2019). The combination of lifelong inattentive features, irritable mood instability, marked variability, and ${racing ? 'racing' : 'crowded'} cognitive phenomenology is the high-risk constellation for antidepressant-induced switches into mania, hypomania, or mixed states. Critically, antidepressant monotherapy is contraindicated in this profile — a mood stabilizer should precede any stimulant or antidepressant trial. Longitudinal mood characterization (≥4 weeks) and Angst-criteria bipolarity screening take priority over confirming ADHD.`;
    }

    if (id === 'C') {
      const supports = joinList([
        strongAffect && 'tight coupling between mood state and attentional failure',
        emotionalCapture && 'attentional capture by emotional content',
        internalCapture && 'capture by internal mental content',
        highVar && 'marked variability that tracks emotional state',
        contextDependent && 'context-sensitive performance',
        heterotypicTraj && 'a heterotypic developmental trajectory (childhood ADHD → adult mood episodes)',
      ], 3);
      const supportSentence = supports
        ? `Supporting findings include ${supports}.`
        : `The decision rests on the strong coupling between affect and attention noted in the dynamics section.`;

      if (affectType === 1) {
        const phenomBit = foggySlowed
          ? ' The foggy/slowed phenomenology paired with low-energy affect is a depressive cognitive signature rather than primary inattention.'
          : ' The low-energy affective profile points at a depressive cognitive process rather than primary inattention.';
        return `Attentional disturbance appears secondary to a depressive process; cognitive engagement is throttled downstream of mood rather than failing intrinsically. ${supportSentence}${phenomBit} Effective antidepressant treatment is the primary intervention — attentional complaints typically remit with mood recovery, and a stimulant trial before that risks treating an epiphenomenon.`;
      }
      if (affectType === 2) {
        const phenomBit = (racing || scattered)
          ? ` ${racing ? 'Racing' : 'Scattered'} phenomenology is consistent with anxious cognitive overactivation rather than under-arousal.`
          : '';
        return `Attentional disturbance appears secondary to anxiety; working memory is hijacked by worry and threat-monitoring rather than failing intrinsically. ${supportSentence}${phenomBit} Anxiety treatment (SSRI, CBT, or anxiolytic) should precede an ADHD work-up.`;
      }
      if (affectType === 3) {
        return `Attentional disturbance appears driven by an irritable/dysphoric affective state in which negative arousal disrupts sustained attention. ${supportSentence} This presentation can mimic ADHD strikingly — irritability plus inattention is a classic mixed-features look — but a stimulant before mood characterization risks worsening dysphoria; longitudinal data and consideration of a mood stabilizer are preferable first steps.`;
      }
      if (affectType === 4) {
        const phenomBit = racing
          ? ' Racing phenomenology raises specific concern for hypomanic-spectrum cognition rather than primary inattention.'
          : ' The activated affective profile raises concern for hypomanic-spectrum cognition rather than primary inattention.';
        return `Attentional disturbance appears driven by affective activation; the system is over-aroused and disorganized rather than under-attentive. ${supportSentence}${phenomBit} A bipolar-spectrum work-up is essential before any stimulant consideration; mood stabilization comes first.`;
      }
      return `Attentional disturbance appears secondary to affective dysregulation. ${supportSentence} Characterizing the affective state more precisely is the next step before any trait attribution.`;
    }

    if (id === 'D') {
      const supports = joinList([
        internalCapture && 'attention dominantly captured by internal content',
        preservedTasks && 'preserved performance on structured tasks (capacity is intact)',
        crowded && 'crowded phenomenology',
        overcontrolled && 'overcontrolled phenomenology',
      ], 3);
      let contentNarrative;
      if (contentIntrusion) {
        contentNarrative = 'The content is ego-dystonic, resisted, and intrusive — characteristic of OCD-spectrum disorders. The therapeutic target is the intrusions themselves through ERP-based therapy and SSRI at OCD-range doses; the attention system is intact and does not need direct treatment.';
      } else if (contentRumination && lowEnergy) {
        contentNarrative = 'The content is ego-syntonic ruminative thought paired with low-energy affect — characteristic of depressive rumination. Mood-first treatment is the appropriate target; attentional complaints typically remit with mood recovery.';
      } else if (contentRumination) {
        contentNarrative = 'The content is ego-syntonic worry/rumination, suggesting GAD or rumination-prone mood states. The treatment target is the ruminative content, not the attention system.';
      } else if (contentTrauma) {
        contentNarrative = 'Trauma-related re-experiencing is the dominant content. Trauma-focused therapy (CPT, PE, EMDR) is the appropriate target; intrusions in this context should NOT be attributed to ADHD distractibility.';
      } else if (contentBizarre) {
        contentNarrative = 'Bizarre or grandiose content raises concern for psychosis-spectrum preoccupation. Psychosis workup, antipsychotic trial consideration, and differentiation from severe OCD with poor insight are the clinical priorities.';
      } else {
        contentNarrative = 'The content has not been characterized; probe whether the material is ego-syntonic worry, ego-dystonic intrusion, trauma-related, or bizarre to narrow the differential.';
      }
      return `Apparent inattention reflects internal attentional capture rather than a primary attentional deficit; capacity is intact but redirected. ${supports ? `Supporting findings include ${supports}. ` : ''}${contentNarrative}`;
    }

    if (id === 'E') {
      const supports = joinList([
        lowEnergy && 'a low-energy affective profile',
        reducedTenacity && 'reduced tenacity for sustained effort',
        lowVar && 'low variability (the impairment is constant rather than fluctuating)',
      ], 3);
      let mechanism;
      if (foggySlowed && !blank) {
        mechanism = 'Foggy/slowed phenomenology paired with low energy is a depressive cognitive signature or points at medical contributors (thyroid, B12, sleep-disordered breathing) — the system is engaged but throttled.';
      } else if (blank && !foggySlowed) {
        mechanism = 'Blank/disengaged phenomenology — distinct from cognitive fog — points more toward severe depression, sedation (medication burden), or dissociation rather than effortful slowing.';
      } else if (foggySlowed && blank) {
        mechanism = 'Mixed foggy and blank phenomenology suggests a heavily sedating contributor — medication burden, untreated sleep-disordered breathing, or severe depression — rather than a single mechanism.';
      } else {
        mechanism = 'The most likely contributors are depressive, medical (thyroid, B12, sleep-disordered breathing), or medication-related rather than a selective attentional deficit.';
      }
      return `Pattern consistent with global cognitive slowing rather than a selective attentional deficit. ${supports ? `Supporting findings include ${supports}. ` : ''}${mechanism} Workup should target systemic contributors (mood, sleep, medications, basic medical screen) before any inattention diagnosis is entertained.`;
    }

    return '';
  };

  const baseInterpretation = buildInterpretation(primary);
  const immersionNote = (taskImmersion && primary.id !== 'D')
    ? " Separately, the patient reports a task-immersion pattern with disengagement difficulty. This is clinically relevant for functional planning (transition routines, screen-time structure, external stopping cues) but is not diagnostically discriminating — case-control evidence (Groen 2020) does not support specificity for this pattern, which appears across ADHD, autism, AuDHD, OCD-spectrum, and nonclinical samples."
    : "";
  const interpretation = baseInterpretation + immersionNote;

  // ── Next steps ──
  const nextStepsMap = {
    'A-I': [
      "Confirm childhood onset with collateral if possible",
      "Confirm cross-setting impairment (work, home, social)",
      "Document functional consequences and adaptive strategies",
      "Consider stimulant or non-stimulant trial",
    ],
    'A-C': [
      "Confirm childhood onset with collateral",
      "Detailed bipolarity history (per Wilens 2003 — ADHD-C has elevated BD comorbidity)",
      "Screen for hypomanic episodes (Angst bipolarity specifier, not just DSM BD-I/II)",
      "Family history of bipolar disorder",
      "If racing thoughts present: distinguish ADHD-pattern (semantic wandering) from hypomanic (phonemic clustering) — collateral and longitudinal data help",
      "Consider treatment of mood comorbidity before or alongside stimulant trial",
    ],
    'B': [
      "Identify primary driver: sleep, stress, medical, or medication",
      "Do NOT diagnose ADHD at this time",
      "Address modifiable state factors first",
      "Reassess attentional profile after stabilization",
    ],
    'C-BRIDGE': [
      "Detailed bipolarity screen using Angst bipolarity specifier (not just DSM BD-I/II)",
      "Family history of bipolar disorder",
      "Detailed history of antidepressant-induced activation, irritability, or mood switches",
      "Mood stabilizer should precede stimulant trial",
      "Consider longitudinal mood charting (≥4 weeks) before treatment decisions",
      "Per BRIDGE-II-Mix: this constellation predicts AD-induced switches — antidepressant monotherapy is high-risk",
    ],
    'D-OCD': [
      "Y-BOCS or similar OCD severity assessment",
      "ERP-based therapy referral",
      "SSRI trial at OCD-range doses",
      "The attention system is intact — target the intrusions",
    ],
    'D-DepRum': [
      "Standard depression workup (PHQ-9, full mood interview)",
      "Treat depression — attentional complaints typically remit with mood recovery",
      "Reassess attention after mood stabilization",
    ],
    'D-PTSD': [
      "Trauma history and PTSD screening (PCL-5)",
      "Trauma-focused therapy referral",
      "Avoid attributing intrusions to ADHD distractibility",
    ],
    'D-Psychotic': [
      "Detailed psychotic symptom inventory",
      "Consider antipsychotic trial",
      "Differentiate from severe OCD with poor insight",
      "Neurological workup if first episode in atypical age range",
    ],
    'E': [
      "Screen for depression (PHQ-9, clinical interview)",
      "Sleep hygiene and sleep disorder review (revisit OSA screen)",
      "Medical workup: thyroid, B12, metabolic panel",
      "Medication review — sedating agents, anticholinergics",
    ],
  };

  const getNextSteps = (p) => {
    if (p.id === 'C' && p.bridgePhenotype) return nextStepsMap['C-BRIDGE'];
    if (p.id === 'C') {
      const subBranchSteps = {
        1: ["Treat depression first", "Attentional complaints often resolve with effective antidepressant treatment", "Reassess attention after mood stabilization"],
        2: ["Treat anxiety first — anxiolytic or SSRI", "Differentiate from ADHD: anxious inattention has distress about failure; ADHD-pattern has frustration", "Reassess attention after anxiety management"],
        3: ["Evaluate for mixed features (DSM-5 specifier)", "Mood stabilizer may be indicated before stimulant consideration", "Irritability + inattention mimics ADHD — do not diagnose without longitudinal data"],
        4: ["Assess for mania/hypomania history", "Check sleep patterns — decreased need is a red flag", "Stimulants are contraindicated if bipolar is suspected", "Mood stabilizer first"],
      };
      return subBranchSteps[affectType] || ["Characterize the affective state more precisely", "Treat mood/anxiety before attributing to ADHD"];
    }
    if (p.id === 'D') {
      if (contentIntrusion) return nextStepsMap['D-OCD'];
      if (contentRumination && lowEnergy) return nextStepsMap['D-DepRum'];
      if (contentRumination) return nextStepsMap['D-DepRum'];
      if (contentTrauma) return nextStepsMap['D-PTSD'];
      if (contentBizarre) return nextStepsMap['D-Psychotic'];
      return ["Characterize the internal content (intrusion vs. rumination vs. trauma vs. bizarre) before treatment", "Target the absorbing content, not the attention system"];
    }
    return nextStepsMap[p.id] || [];
  };

  const immersionSteps = [
    "Functional planning for task-immersion pattern: external stopping cues, transition routines, structured screen-time limits",
    "Functional consequences (gaming/screen overuse, missed transitions, neglect of basic needs) are the management target — not the phenomenology itself",
  ];

  // ── Conflict detection ──
  const conflicts = [];

  if ((primary.id === 'A-I' || primary.id === 'A-C') && highVar) {
    conflicts.push({
      label: 'Trait pattern with elevated variability',
      text: 'High variability is atypical for a purely trait-based attentional disorder. Consider whether a state-dependent component is contributing — sleep, mood, or stress factors may need to be addressed before committing to an ADHD diagnosis.',
    });
  }

  if (preservedTasks && obsAvg !== null && obsAvg <= 2.5) {
    conflicts.push({
      label: 'Task–Function Discrepancy',
      text: "Structured task performance exceeds real-world functioning. Consider: hot EF impairment (intact cool EF, impaired under emotional load), affective interference in naturalistic contexts, or environmental drivers that structured testing doesn't capture.",
    });
  }

  if (taskAvg !== null && taskAvg <= 2.5 && obsAvg !== null && obsAvg >= 3.5) {
    conflicts.push({
      label: 'Testing Artifact Possible',
      text: "Formal testing underestimates function relative to natural conversation. Consider: test anxiety, effort issues, the 'experimental condition' effect, or specific cognitive deficits exposed by structured tasks.",
    });
  }

  if ((primary.id === 'A-I' || primary.id === 'A-C') && taskAvg != null && taskAvg >= 4 && obsAvg != null && obsAvg >= 4) {
    conflicts.push({
      label: 'Self-reported trait pattern with intact testing and observation',
      text: 'The patient reports trait inattention but performs well on structured tasks AND shows no observable inattention. Three possibilities: (1) genuine ADHD where structured-test demands provide scaffolding that masks naturalistic dysfunction — verify functional impairment in high-demand naturalistic contexts; (2) over-reporting or symptom amplification; (3) anxiety-related cognitive complaints reflecting distress rather than attentional capacity. Collateral history is essential before diagnosing.',
    });
  }

  if ((primary.id === 'A-I' || primary.id === 'A-C') && acuteOnset) {
    conflicts.push({
      label: 'Apparent trait pattern with non-stable course',
      text: 'Trait-consistent features are present, but the course is acute or progressive rather than lifelong. ADHD diagnostic criteria require onset before age 12. Adult-onset attentional symptoms with otherwise ADHD-like features should prompt workup for: medical contributors (revisit medical mimic screen), mood disorder, neurocognitive decline, or substance effects — NOT a primary ADHD diagnosis.',
    });
  }

  if (primary.id === 'A-C' && (racing || affectType === 4)) {
    conflicts.push({
      label: 'ADHD-Combined pattern with hypomanic-spectrum features',
      text: 'The combined-ADHD pattern overlaps substantially with hypomanic-spectrum cognition. Per Bertschy et al. (2023), the lexical signature differs — semantic wandering across distant concepts in ADHD vs. phonemic associations (rhymes, puns) in hypomania — but this is difficult to detect at bedside. Per Wilens et al. (2003), ADHD+BD-II is the most common comorbidity pattern. Before any stimulant trial: detailed bipolarity history (Angst specifier), decreased need for sleep, family history of BD, and any prior antidepressant-induced activation.',
    });
  }

  if ((primary.id === 'A-I' || primary.id === 'A-C') && heterotypicTraj) {
    conflicts.push({
      label: 'ADHD pattern with heterotypic developmental trajectory',
      text: 'Childhood ADHD with emergence of adult mood episodes (heterotypic trajectory per Faedda) suggests this may be a distinct ADHD-BD comorbid phenotype rather than pure ADHD. Per Comparelli et al. (2022), this constellation has different treatment implications than ADHD without mood-spectrum evolution. Consider mood characterization before or alongside ADHD treatment.',
    });
  }

  // Added: task performance is non-specific and does not support ADHD attribution.
  // Grant & Chamberlain 2023 — OCD, social phobia, bulimia, BED, and IED all showed LARGER
  // sustained-attention deficits than probable ADHD in direct transdiagnostic comparison.
  if ((primary.id === 'A-I' || primary.id === 'A-C') && taskAvg != null && taskAvg <= 2.5) {
    conflicts.push({
      label: 'Poor task performance does not support ADHD attribution',
      text: 'Structured attentional tasks are impaired, but task impairment is non-specific and is NOT evidence for ADHD. In direct transdiagnostic comparison (Grant & Chamberlain 2023, n=576), sustained-attention deficits were larger in OCD, social phobia, bulimia nervosa, binge eating disorder, and intermittent explosive disorder than in probable ADHD. Before attributing impaired task performance to an ADHD-pattern process, screen explicitly for obsessive-compulsive symptoms, social anxiety, and disordered eating. A failed CPT should widen the differential rather than narrow it.',
    });
  }

  // Added: stimulant exposure / evidential use. Paris et al. 2015 — stimulant response is non-specific.
  if (s("ctx_stimulant") != null && s("ctx_stimulant") <= 3) {
    const stimText = {
      1: 'The patient is offering stimulant response as evidence for the diagnosis. Stimulants improve attention and focus in people without ADHD; response is non-specific and diagnostically uninformative (Paris et al. 2015). Subjective benefit also correlates poorly with formal testing, so placebo response may be more common in practice than in trials. Redirect to history, cross-context impairment, and collateral.',
      2: 'Non-prescribed or diverted stimulant use is documented. This is relevant both as a confound for current attentional findings (see substance use item) and as context for the presenting complaint. It does not by itself argue for or against an ADHD-pattern process, but it should be addressed directly rather than left implicit.',
      3: 'The patient is currently prescribed a stimulant on the basis of an evaluation you have not reviewed. An existing prescription is not confirmatory. If ADHD attribution matters for the current formulation, obtain the originating evaluation or re-establish the diagnosis independently.',
    }[s("ctx_stimulant")];
    conflicts.push({
      label: 'Stimulant exposure — non-specific and non-confirmatory',
      text: stimText,
    });
  }

  // ── Build modifiers list ──
  const modifiers = [];
  if (highVar) modifiers.push("Marked variability");
  if (markedFluctuation) modifiers.push("Within-session fluctuation");
  if (strongAffect) modifiers.push("Strong affective coupling");
  if (internalCapture) modifiers.push("Internal attentional capture");
  if (externalCapture) modifiers.push("External distractibility");
  if (emotionalCapture) modifiers.push("Emotional capture");
  if (taskAvoidance) modifiers.push("Task avoidance pattern");
  if (timeOnTaskDecline) modifiers.push("Time-on-task decline");
  if (contextDependent) modifiers.push("State-dependent");
  if (combinedSubtype) modifiers.push("Combined H/I subtype");
  if (heterotypicTraj) modifiers.push("Heterotypic trajectory");
  if (homotypicTrait) modifiers.push("Homotypic trajectory");
  if (taskImmersion) modifiers.push("Task immersion pattern (non-specific)");

  const phenom = s("dyn_phenom");
  const phenomLabels = { 1: "Foggy/slowed", 2: "Scattered", 3: "Crowded", 4: "Racing", 5: "Blank/disengaged", 6: "Overcontrolled" };
  if (phenom && phenomLabels[phenom]) modifiers.push(phenomLabels[phenom] + " phenomenology");

  if (content && content >= 1 && content <= 4) {
    const contentLabels = { 1: "Ruminative content", 2: "Intrusive content", 3: "Trauma content", 4: "Bizarre content" };
    modifiers.push(contentLabels[content]);
  }

  // ── Implication ──
  let implication = "";
  if ((primary.id === 'A-I' || primary.id === 'A-C') && conflicts.length === 0) {
    implication = "Findings are consistent with an ADHD-pattern presentation. Proceed with confirmatory evaluation.";
  } else if ((primary.id === 'A-I' || primary.id === 'A-C') && conflicts.length > 0) {
    implication = "ADHD pattern present but conflicts exist. Address the flagged issues before diagnosing.";
  } else if (primary.bridgePhenotype) {
    implication = "Mood-spectrum characterization is the priority. Stimulant monotherapy is contraindicated until mood is stabilized.";
  } else if (primary.id !== 'A-I' && primary.id !== 'A-C') {
    implication = "ADHD diagnosis should be deferred pending resolution of the identified attentional driver.";
  }

  const baseSteps = getNextSteps(primary);
  const finalSteps = (taskImmersion && primary.id !== 'D')
    ? [...baseSteps, ...immersionSteps]
    : baseSteps;

  return {
    primary: { id: primary.id, label: primary.label, met: primary.met, total: primary.total, criteria: primary.criteria, bridgePhenotype: primary.bridgePhenotype },
    runner: runner ? { id: runner.id, label: runner.label, met: runner.met, total: runner.total, criteria: runner.criteria } : null,
    isUrgent: false,
    interpretation,
    nextSteps: finalSteps,
    implication,
    conflicts,
    modifiers,
    allPathways: pathways.map(p => ({ id: p.id, label: p.label, met: p.met, total: p.total, score: p.score })),
  };
}
