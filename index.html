<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Attention Assessment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body style="margin:0;padding:0">
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useEffect, useRef } = React;

const SECTIONS = [
  {
    id: "observation",
    title: "Behavioral Observation",
    subtitle: "General attentiveness during interview",
    instructions: "Rate the following based on direct observation during the clinical encounter. These items do not require formal testing.",
    items: [
      { id: "obs_1", text: "Patient awareness of purpose of examination and current situation", anchors: ["Unaware of purpose/situation", "Vaguely aware", "Partially oriented to situation", "Mostly aware", "Fully oriented to situation and purpose"] },
      { id: "obs_2", text: "Conversational coherence — ability to maintain logical thread without rambling or contradiction", anchors: ["Incoherent / frequent contradictions", "Frequent tangentiality", "Occasional drift from topic", "Mostly coherent", "Fully coherent and goal-directed"] },
      { id: "obs_3", text: "Sustained engagement — maintains attention throughout interview without external redirection", anchors: ["Cannot sustain beyond seconds", "Frequent disengagement", "Intermittent lapses", "Mostly sustained", "Fully sustained throughout"] },
      { id: "obs_4", text: "Psychomotor presentation (hypoactivity, hyperactivity, tremor, myoclonus, or other movement abnormalities)", anchors: ["Marked abnormality", "Moderate abnormality", "Mild abnormality", "Questionable finding", "No abnormality observed"] },
      { id: "obs_5", text: 'Subjective report — does the patient describe their thinking as "foggy/cloudy" vs "sharp/clear"?', anchors: ["Reports marked fogginess", "Reports moderate fogginess", "Reports mild fogginess", "Reports mostly clear", "Reports sharp and clear"] },
      { id: "obs_6", text: "Facial expression and apparent perplexity (wide-eyed, bewildered appearance)", anchors: ["Markedly perplexed", "Moderately perplexed", "Mildly perplexed", "Questionable", "Alert and appropriate"] },
    ],
  },
  {
    id: "orientation",
    title: "Orientation",
    subtitle: "Temporal, spatial, situational, and personal",
    instructions: "Prevent patient from consulting watches, calendars, phones, or asking others. Normal ranges: within 4 hours of current time, 3 days of date, 2 days of day-of-week, and correct month/year.",
    items: [
      { id: "ori_1", text: "Temporal — day of week, date, month, year, season, and approximate current time", anchors: ["Disoriented to most elements", "Knows month/year only", "Knows month/year + day of week", "Off by ≤3 days on date", "Fully oriented within normal limits"] },
      { id: "ori_2", text: "Functional time sense — awareness of passage of time (distinct from knowing the calendar date)", anchors: ["No sense of time passage", "Markedly impaired", "Moderately impaired", "Mildly impaired", "Intact functional time sense"] },
      { id: "ori_3", text: "Place — type of facility, name of facility, city/neighborhood, state", anchors: ["Disoriented to type of place", "Knows type but not name/location", "Knows type and name, not locale", "Minor error (e.g., wrong floor/ward)", "Fully oriented to place"] },
      { id: "ori_4", text: "Directional/spatial — can describe location of home relative to clinic, direction of travel, estimated travel time", anchors: ["Cannot describe any spatial relations", "Markedly impaired", "Moderately impaired", "Mildly impaired", "Intact spatial/directional orientation"] },
      { id: "ori_5", text: "Situational — reason for visit, current clinical context", anchors: ["No awareness of reason for visit", "Vague/incorrect understanding", "Partial understanding", "Mostly accurate", "Fully aware of situation and reason"] },
      { id: "ori_6", text: "Personal (autopsychic) — name, age, biographical details", anchors: ["Cannot provide personal details", "Markedly impaired", "Moderately impaired", "Minor inaccuracies", "Fully oriented to self"] },
    ],
  },
  {
    id: "temporal",
    title: "Temporal Pattern",
    subtitle: "Course, context sensitivity, and cross-context pattern",
    instructions: "Establish the temporal profile of attentional complaints before proceeding to formal testing. This section is required before interpretation — it determines whether findings should be read as state or trait.",
    items: [
      {
        id: "temp_1", text: "Course of attentional difficulty", isQualitative: true,
        anchors: ["Lifelong, stable", "Lifelong, variable", "Episodic (days–weeks)", "Progressive", "Acute onset"],
        administration: "Ask: \"Have you always had trouble with focus, or is this new?\" \"Did teachers or parents comment on your attention as a child?\" \"When did you first notice this was a problem?\" \"Does it come and go, or is it constant?\" Lifelong-stable strongly supports ADHD. Lifelong-variable suggests ADHD with mood/anxiety modulation. Episodic points to mood episodes, substance cycles, or stress-reactive patterns. Progressive raises neurocognitive decline. Acute onset (days) demands delirium workup.",
      },
      {
        id: "temp_2", text: "Context sensitivity — how much does the attentional difficulty vary with state factors?", isQualitative: true,
        anchors: ["Stable across contexts", "Varies with stress", "Varies with sleep", "Varies with mood", "Highly state-dependent"],
        administration: "Probe: \"Is your concentration about the same regardless of how you're feeling, or does it change a lot depending on your stress/sleep/mood?\" Stable-across-contexts supports a trait deficit (ADHD, neurocognitive). High state-dependence suggests the attentional problem is secondary to a modifiable driver.",
      },
      {
        id: "temp_3", text: "Cross-context pattern — does the attentional difficulty manifest across settings or is it context-specific?", isQualitative: true,
        anchors: ["Isolated to one context", "Primarily one setting, mild in others", "Two settings affected", "Most settings affected", "Pervasive across all contexts"],
        administration: "Ask about attention/concentration at work, at home, in social settings, and during leisure activities. ADHD-pattern dysfunction typically shows friction across multiple settings. Context-specific dysfunction suggests the attentional difficulty may be driven by the emotional/motivational characteristics of that setting. Also probe for interest-based variation: \"Are there things you can focus on easily?\" The ability to hyperfocus on novel/rewarding tasks while being completely blocked by routine/low-reward tasks is characteristic of ADHD.",
      },
    ],
  },
  {
    id: "attentional_tasks",
    title: "Structured Attentional Tasks",
    subtitle: "Serial recitation, continuous performance, and spatial tasks",
    instructions: 'Administer 3–4 different types of attentional tasks and mentally "factor analyze" the common denominator. These are supplementary to clinical observation, not a replacement. Maintain a non-threatening atmosphere.',
    items: [
      { id: "task_1", text: "Digit Span Forward — serial recitation (normal ≥ 5 digits)", administration: "Read a sequence of random digits aloud at a rate of one per second (avoid rhythmic grouping). Start with 3 digits. After each correct repetition, increase by one digit. Give two trials at each length. Record the longest span correctly repeated on at least one of two trials.", anchors: ["≤2 digits", "3 digits", "4 digits", "5 digits", "≥6 digits"] },
      { id: "task_2", text: "Digit Span Backward — working memory component (normal ≥ 3 digits)", administration: "Read a sequence of random digits aloud at one per second. Ask the patient to repeat them in reverse order. Demonstrate with a 2-digit example first. Start with 2 digits. A forward-backward discrepancy of >2 digits suggests a working memory deficit beyond simple attentional impairment.", anchors: ["Unable to perform", "2 digits", "3 digits", "4 digits", "≥5 digits"] },
      { id: "task_3", text: 'Continuous Performance — "A" vigilance task or similar (sustained attention over ≥2 minutes)', administration: "Read aloud a series of random letters at one per second for at least 2 minutes. Instruct the patient to tap the table each time they hear the target letter. ~10% target frequency. Record omission errors, commission errors, and whether performance degrades over time.", anchors: ["Unable to engage with task", "Multiple omissions and commissions", "Several errors, declining with time", "Few errors, stable performance", "Accurate and consistent throughout"] },
      { id: "task_4", text: "Serial 7s or Serial 3s — sustained calculation (assess for both accuracy and consistency)", administration: "Ask the patient to subtract 7 from 100 and keep subtracting. Record both accuracy and consistency — a patient who makes one early arithmetic error but continues subtracting correctly from their wrong answer shows intact attention with a calculation error (different from attentional failure).", anchors: ["Unable to begin", "≤2 correct before stopping", "3–4 correct with errors", "Mostly correct, occasional error", "Accurate and fluent"] },
      { id: "task_5", text: "Months/days backward — overlearned sequence reversal", administration: "Ask the patient to recite months backward from December. Time the response — healthy adults complete in under 30 seconds. Note whether errors are skips, perseverations, or complete derailment. Self-corrections count as intact performance.", anchors: ["Unable to perform", "Marked difficulty, multiple errors", "Moderate difficulty", "Mild difficulty or self-corrects", "Fluent and accurate"] },
      { id: "task_6", text: "Interviewability probe — ability to count raised fingers on examiner's hands", administration: "Hold up both hands and display a random number of raised fingers (vary between trials). If the patient fails this, more complex attentional tasks are unlikely to yield valid results. Use 3–5 trials.", anchors: ["Unable to perform", "Frequent errors", "Occasional errors", "Accurate but slow", "Accurate and prompt"] },
    ],
  },
  {
    id: "attentional_dynamics",
    title: "Attentional Dynamics",
    subtitle: "Tenacity, vigilance, variability, phenomenology, and affective coupling",
    instructions: "Assess based on the full encounter. Tenacity = concentration/fixation on a target. Vigilance (descriptive psychopathology sense) = mobility/shifting of attention.",
    items: [
      { id: "dyn_1", text: "Tenacity — ability to sustain focused concentration on a single target or topic", anchors: ["Hypotenacity — cannot fix attention", "Reduced tenacity", "Normal tenacity", "Mildly increased tenacity", "Hypertenacity — rigidly fixated"] },
      { id: "dyn_2", text: "Vigilance (mobility) — ability to appropriately shift attention to new relevant stimuli", anchors: ["Hypovigilance — fails to shift", "Reduced shifting", "Normal mobility", "Increased shifting", "Hypervigilance — shifts to every stimulus"] },
      // Revision 2: Expanded variability
      { id: "var_1", text: "Within-session variability — moment-to-moment fluctuation in performance during this encounter", anchors: ["None", "Mild", "Moderate", "Marked", "Extreme"] },
      { id: "var_2", text: "Day-to-day variability — patient-reported fluctuation across days (by history)", anchors: ["None", "Mild", "Moderate", "Marked", "Extreme"], isQualitative: true, administration: "Ask: \"Do you have good days and bad days for concentration, or is it about the same every day?\" \"How different are your best days from your worst days?\"" },
      { id: "var_3", text: "Sleep sensitivity — how much does sleep quality/quantity affect attentional performance?", anchors: ["None", "Mild", "Moderate", "Marked", "Extreme"], isQualitative: true, administration: "Ask: \"How much does a bad night's sleep affect your concentration the next day?\" Compare with contextual sleep data." },
      { id: "var_4", text: "Stress sensitivity — how much does acute stress affect attentional performance?", anchors: ["None", "Mild", "Moderate", "Marked", "Extreme"], isQualitative: true, administration: "Ask: \"When you're under stress, does your concentration get worse? How much worse?\"" },
      // Revision 8: Merged attentional capture (replaces dyn_4 + dyn_5)
      {
        id: "dyn_capture", text: "Source of attentional capture — when attention fails, what captures it?", isQualitative: true,
        anchors: ["External stimuli", "Internal thoughts", "Emotional states", "Task avoidance", "Mixed / unclear"],
        administration: "Ask: \"When you lose focus, where does your mind go?\" Distinguish between: External stimuli = environmental distractions pull attention (classic distractibility). Internal thoughts = obsessions, rumination, worry, or delusional content consume attention (attentional depolarization). Emotional states = affect itself disrupts processing. Task avoidance = attention diverts from aversive tasks to anything else. This replaces the prior distractibility vs. distraction and depolarization items with a cleaner mechanistic construct.",
      },
      // Revision 3: Upgraded phenomenology (7 anchors)
      {
        id: "dyn_phenom", text: "Subjective attentional experience — what is the qualitative 'texture' of the attentional difficulty?", isQualitative: true,
        anchors: ["Foggy / slowed", "Scattered / externally pulled", "Crowded (too many thoughts)", "Racing (accelerated, pressured)", "Blank / disengaged", "Overcontrolled / perfectionistic", "No difficulty"],
        administration: "Ask: \"When your concentration is at its worst, what does it feel like inside your head?\" Key patterns: Foggy/slowed → delirium, depression, medication effects, fatigue. Scattered/pulled → ADHD, anxiety, hyperactive delirium. Crowded → OCD, GAD, PTSD, psychosis-spectrum. Racing → mania/hypomania, stimulant effects, severe anxiety. Blank/disengaged → depression, dissociation, apathy syndromes. Overcontrolled → perfectionism, social anxiety, OCPD.",
      },
      // Revision 4: Affective coupling
      {
        id: "dyn_affect", text: "Affective coupling — when attention fails, what is the dominant affective state?", isQualitative: true,
        anchors: ["Depressed / low energy", "Anxious / worried", "Irritable / tense", "Agitated / driven", "Neutral / no mood shift"],
        administration: "Ask: \"When you can't concentrate, how do you feel emotionally? Low? Anxious? Irritable? Or is your mood not really part of it?\" This is critical for: mixed states (where irritability + inattention can mimic ADHD), anxiety vs. ADHD (anxious inattention has a different treatment path), and depression vs. fatigue (mood coloring of attentional failure has diagnostic value).",
      },
      {
        id: "dyn_8", text: "Hot executive function — capacity for self-regulation in emotionally or motivationally charged contexts",
        anchors: ["Severe dysregulation under emotional load", "Frequent impulsive/reward-driven failures", "Occasional lapses in emotionally charged contexts", "Mild difficulty, generally compensates", "Intact regulation across contexts"],
        administration: "Probe with questions about real-world decision-making: \"Do you find it harder to think clearly when you're upset or excited?\" A patient who passes all structured tasks but reports severe real-world self-regulation failures may have selective hot EF impairment with preserved cool EF.",
      },
      {
        id: "dyn_9", text: "Metacognitive accuracy — does the patient's self-assessment of their attentional/cognitive abilities match observed performance?", isQualitative: true,
        anchors: ["Marked overconfidence (reports intact, performs poorly)", "Mild overconfidence", "Accurate self-assessment", "Mild underconfidence (catastrophizes deficits)", "Marked underconfidence (reports severe impairment, performs normally)"],
        administration: "Compare the patient's subjective report with actual performance. Overconfidence is associated with compulsive phenotypes and anosognosia. Underconfidence is common in depression and anxiety.",
      },
      { id: "dyn_6", text: "Attentional bias — attention captured by disorder-specific stimuli (e.g., substance cues, threat cues, somatic sensations)", anchors: ["Marked bias observed", "Moderate bias", "Mild bias", "Questionable", "No bias observed"] },
    ],
  },
  {
    id: "context",
    title: "Contextual Modifiers",
    subtitle: "Factors affecting attentional performance",
    instructions: "Document factors that may be contributing to attentional findings. These inform interpretation rather than scoring.",
    items: [
      { id: "ctx_1", text: "Sleep status — hours of sleep in past 24h and recent sleep pattern", anchors: ["Severe deprivation (<2h)", "Moderate deprivation (2–4h)", "Mild deprivation (4–6h)", "Adequate (6–7h)", "Well-rested (≥7h)"] },
      { id: "ctx_2", text: "Acute stress level at time of assessment", anchors: ["Severe acute stress", "Moderate stress", "Mild stress", "Minimal stress", "Calm/relaxed"] },
      { id: "ctx_3", text: "Medication effects — current psychotropic or other medications with known attentional impact", anchors: ["Likely significant impact", "Probable moderate impact", "Possible mild impact", "Unlikely impact", "No relevant medications"] },
      { id: "ctx_4", text: "Substance use — recent use of substances with attentional effects", anchors: ["Active intoxication/withdrawal", "Recent use (<24h)", "Recent use (24–72h)", "Remote use", "No recent use"] },
      { id: "ctx_5", text: "Time on task — was attentional performance stable or declining as the assessment progressed?", anchors: ["Rapid early decline", "Progressive decline", "Mild late decline", "Stable throughout", "Improved with engagement"] },
      // Revision 5: Triggering factors
      {
        id: "ctx_triggers", text: "Triggering factors — what precipitates or worsens attentional episodes?", isQualitative: true,
        anchors: ["None identifiable", "Sleep deprivation", "Stress", "Conflict / interpersonal", "Medication / substance", "Mood episode"],
        administration: "Ask: \"Can you identify anything that makes your concentration worse? Does it follow bad sleep, stressful events, arguments, medication changes, or mood shifts?\" This tightens causal inference: identifiable triggers suggest state-dependent attentional impairment with a modifiable driver, while no identifiable triggers are more consistent with a trait deficit.",
      },
    ],
  },
];

// ──────────────────────────────────────────────────────────────────
// Section index helpers (since order changed)
// ──────────────────────────────────────────────────────────────────
const SEC_IDX = {};
SECTIONS.forEach((s, i) => SEC_IDX[s.id] = i);

function getSeverityColor(score) {
  if (score === null) return "var(--c-border)";
  if (score <= 1) return "#c0392b";
  if (score <= 2) return "#e67e22";
  if (score <= 3) return "#f1c40f";
  if (score <= 4) return "#27ae60";
  return "#2980b9";
}

function getSeverityLabel(score) {
  if (score === null) return "—";
  if (score <= 1) return "Severe";
  if (score <= 2) return "Moderate";
  if (score <= 3) return "Mild";
  if (score <= 4) return "Normal";
  return "Intact";
}

// ──────────────────────────────────────────────────────────────────
// Bedside tool integration
// ──────────────────────────────────────────────────────────────────

const TOOL_MAP = {
  task_1: { file: 'digit_span_admin.html', label: 'Digit Span Tool' },
  task_2: { file: 'digit_span_admin.html', label: 'Digit Span Tool' },
  task_3: { file: 'cpt_admin.html', label: 'CPT Tool' },
  task_4: { file: 'serial_subtraction_admin.html', label: 'Serial Subtraction Tool' },
  task_5: { file: 'months_backward_admin.html', label: 'Months Backward Tool' },
  task_6: { file: 'finger_counting_admin.html', label: 'Finger Counting Tool' },
};

const getToolForItem = (itemId) => TOOL_MAP[itemId] || null;

const TOOL_LABELS = {
  digit_span: 'Digit Span', cpt: 'CPT', serial_subtraction: 'Serial Subtraction',
  months_backward: 'Months Backward', finger_counting: 'Finger Counting',
};

// Domains that contribute to the (demoted) composite — excludes context and temporal
const SCORED_DOMAINS = ['observation', 'orientation', 'attentional_tasks', 'attentional_dynamics'];

// ──────────────────────────────────────────────────────────────────
// Diagnostic Pathway Engine
// ──────────────────────────────────────────────────────────────────

function evaluatePathways(scores, sectionAvgs) {
  const s = (id) => scores[id];
  const obsAvg = sectionAvgs.observation;
  const oriAvg = sectionAvgs.orientation;
  const taskAvg = sectionAvgs.attentional_tasks;

  // Computed features
  const lowVar = (s("var_1") != null && s("var_1") <= 2) && (s("var_2") == null || s("var_2") <= 2);
  const highVar = (s("var_1") != null && s("var_1") >= 3) || (s("var_2") != null && s("var_2") >= 3);
  const crossContext = s("temp_3") != null && s("temp_3") >= 4;
  const contextDependent = s("temp_2") != null && s("temp_2") >= 4;
  const stablePattern = s("temp_1") != null && s("temp_1") <= 2;
  const externalCapture = s("dyn_capture") === 1;
  const internalCapture = s("dyn_capture") === 2;
  const emotionalCapture = s("dyn_capture") === 3;
  const taskAvoidance = s("dyn_capture") === 4;
  const weakAffect = s("dyn_affect") === 5;
  const strongAffect = s("dyn_affect") != null && s("dyn_affect") <= 4;
  const affectType = s("dyn_affect");
  const foggySlowed = s("dyn_phenom") === 1;
  const scattered = s("dyn_phenom") === 2;
  const crowded = s("dyn_phenom") === 3;
  const racing = s("dyn_phenom") === 4;
  const blank = s("dyn_phenom") === 5;
  const lowTenacity = s("dyn_1") != null && s("dyn_1") <= 2;
  const lowVigilance = s("dyn_2") != null && s("dyn_2") <= 2;
  const reducedTenacity = s("dyn_1") != null && s("dyn_1") <= 2;
  const timeOnTaskDecline = s("ctx_5") != null && s("ctx_5") <= 2;
  const perplexity = s("obs_6") != null && s("obs_6") <= 2;
  const disorientation = oriAvg !== null && oriAvg <= 2;
  const preservedTasks = taskAvg !== null && taskAvg >= 4;
  const lowEnergy = affectType === 1;

  // ── Pathway F: Delirium (hard stop) ──
  const pathF = {
    id: 'F', label: 'Delirium / Global Impairment',
    met: 0, total: 3, criteria: [],
  };
  if (lowTenacity && lowVigilance) { pathF.met++; pathF.criteria.push('Low tenacity + low vigilance'); }
  if (disorientation) { pathF.met++; pathF.criteria.push('Disorientation'); }
  if (perplexity) { pathF.met++; pathF.criteria.push('Perplexity'); }

  if (pathF.met >= 2) {
    return {
      primary: pathF,
      isUrgent: true,
      interpretation: "Pattern consistent with disturbance of consciousness (delirium until proven otherwise). The combination of global attentional collapse with disorientation and/or perplexity has high specificity for an organic confusional state.",
      nextSteps: ["Immediate medical workup: metabolic panel, CBC, UA, vitals, O2 sat", "Formal delirium screening (CAM, DRS-R-98)", "Medication review — especially anticholinergic burden", "Assess for fluctuating course (hallmark of delirium)", "Do NOT attribute to psychiatric diagnosis without ruling out delirium first"],
      implication: "All other diagnostic considerations are deferred until delirium is excluded.",
      conflicts: [],
      modifiers: pathF.criteria,
    };
  }

  // ── Score all non-urgent pathways ──
  const pathways = [];

  // Pathway A: Trait ADHD-consistent
  const pathA = { id: 'A', label: 'Stable trait attentional inefficiency (ADHD-consistent)', met: 0, total: 5, criteria: [] };
  if (stablePattern) { pathA.met++; pathA.criteria.push('Stable/lifelong pattern'); }
  if (lowVar) { pathA.met++; pathA.criteria.push('Low variability'); }
  if (crossContext) { pathA.met++; pathA.criteria.push('Cross-context impairment'); }
  if (externalCapture || taskAvoidance) { pathA.met++; pathA.criteria.push(externalCapture ? 'External distractibility' : 'Task avoidance'); }
  if (weakAffect) { pathA.met++; pathA.criteria.push('Weak affective coupling'); }
  pathways.push(pathA);

  // Pathway B: State-dependent (non-ADHD)
  const pathB = { id: 'B', label: 'State-dependent attentional impairment', met: 0, total: 4, criteria: [] };
  if (highVar) { pathB.met++; pathB.criteria.push('High variability'); }
  if (contextDependent) { pathB.met++; pathB.criteria.push('Strong context dependence'); }
  if (timeOnTaskDecline) { pathB.met++; pathB.criteria.push('Time-on-task decline'); }
  if (s("var_3") != null && s("var_3") >= 3 || s("var_4") != null && s("var_4") >= 3) { pathB.met++; pathB.criteria.push('High sleep/stress sensitivity'); }
  pathways.push(pathB);

  // Pathway C: Affective-driven
  const pathC = { id: 'C', label: 'Affective-driven attentional instability', met: 0, total: 3, criteria: [] };
  if (strongAffect) { pathC.met++; pathC.criteria.push('Strong affective coupling'); }
  if (affectType === 2 || affectType === 3 || affectType === 4) { pathC.met++; pathC.criteria.push('Irritability/anxiety/agitation present'); }
  if (highVar || internalCapture || emotionalCapture) { pathC.met++; pathC.criteria.push(highVar ? 'High variability' : emotionalCapture ? 'Emotional capture' : 'Internal capture'); }
  pathways.push(pathC);

  // Pathway D: Internal preoccupation
  const pathD = { id: 'D', label: 'Internal preoccupation pattern', met: 0, total: 3, criteria: [] };
  if (internalCapture) { pathD.met++; pathD.criteria.push('Internal capture dominant'); }
  if (crowded || s("dyn_phenom") === 6) { pathD.met++; pathD.criteria.push('Crowded/overcontrolled phenomenology'); }
  if (preservedTasks) { pathD.met++; pathD.criteria.push('Preserved task performance'); }
  pathways.push(pathD);

  // Pathway E: Cognitive slowing / fatigue
  const pathE = { id: 'E', label: 'Cognitive slowing / fatigue pattern', met: 0, total: 4, criteria: [] };
  if (foggySlowed || blank) { pathE.met++; pathE.criteria.push(foggySlowed ? 'Foggy/slowed phenomenology' : 'Blank/disengaged phenomenology'); }
  if (lowEnergy) { pathE.met++; pathE.criteria.push('Low energy affect'); }
  if (reducedTenacity) { pathE.met++; pathE.criteria.push('Reduced tenacity'); }
  if (lowVar) { pathE.met++; pathE.criteria.push('Low variability'); }
  pathways.push(pathE);

  // Sort by proportion of criteria met (descending)
  pathways.sort((a, b) => (b.met / b.total) - (a.met / a.total));

  const primary = pathways[0];
  const runner = pathways[1];
  const hasEnoughData = primary.met >= 1;

  if (!hasEnoughData) return null;

  // ── Build interpretation (case-specific, draws on actual computed features) ──
  const sleepSensitive = s("var_3") != null && s("var_3") >= 3;
  const stressSensitive = s("var_4") != null && s("var_4") >= 3;
  const runnerNearMiss = runner && (runner.met / runner.total) >= 0.5;
  const joinList = (arr, max) => {
    let items = arr.filter(Boolean);
    if (max) items = items.slice(0, max);
    if (items.length === 0) return '';
    if (items.length === 1) return items[0];
    if (items.length === 2) return `${items[0]} and ${items[1]}`;
    return `${items.slice(0, -1).join(', ')}, and ${items[items.length - 1]}`;
  };

  const buildInterpretation = (id) => {
    if (id === 'A') {
      const findings = joinList([
        stablePattern && 'a stable, lifelong course',
        crossContext && 'impairment that crosses settings',
        lowVar && 'low intra- and inter-session variability',
        weakAffect && 'attention that does not track mood state',
        externalCapture && 'external distractibility',
        taskAvoidance && !externalCapture && 'avoidance of effortful tasks',
      ], 3);
      const preservedNote = preservedTasks
        ? ' Structured tasks remain relatively preserved, which is consistent with ADHD’s typical dissociation between coercive testing and naturalistic functioning — capacity is intact when external scaffolding is high, and degrades as demands become self-directed.'
        : '';
      let differential = '';
      if (runnerNearMiss && runner.id === 'C') {
        differential = ' Affective features are present but appear secondary; the trait architecture is preserved across mood states, which argues against a primarily affective driver.';
      } else if (runnerNearMiss && runner.id === 'B') {
        differential = ' Some state sensitivity was noted, but the lifelong course and low variability outweigh it and point at a fixed trait rather than a modifiable driver.';
      } else if (runnerNearMiss && runner.id === 'E') {
        differential = ' Slowing/fatigue features are present but do not by themselves explain the cross-context, lifelong picture.';
      }
      return `Pattern most consistent with trait attentional inefficiency (ADHD phenotype). The conclusion rests on ${findings || 'the configuration of trait features described above'}, which together argue against a state-driven explanation.${preservedNote}${differential}`;
    }

    if (id === 'B') {
      const drivers = [];
      if (sleepSensitive) drivers.push('sleep');
      if (stressSensitive) drivers.push('acute stress');
      if (timeOnTaskDecline) drivers.push('sustained effort (time-on-task decline)');
      if (contextDependent) drivers.push('environmental context');
      const driverPhrase = drivers.length ? joinList(drivers) : 'identifiable state factors';
      const varNote = highVar
        ? ' The marked variability indicates a system that can attend when conditions allow, which is incompatible with a fixed trait deficit.'
        : '';
      let differential = '';
      if (runnerNearMiss && runner.id === 'A') {
        differential = ' ADHD remains on the differential, but committing to a trait diagnosis is premature while modifiable drivers are unaddressed.';
      } else if (runnerNearMiss && runner.id === 'C') {
        differential = ' An affective contribution is plausible and may be one of the modifiable drivers worth characterizing.';
      } else if (runnerNearMiss && runner.id === 'E') {
        differential = ' Cognitive slowing features overlap, but the variability pattern argues for a state-dependent rather than uniformly throttled process.';
      }
      return `Pattern most consistent with state-dependent attentional impairment, with the principal driver(s) appearing to be ${driverPhrase}.${varNote} A fixed deficit is unlikely; addressing the modifiable factor(s) and reassessing should precede any trait diagnosis.${differential}`;
    }

    if (id === 'C') {
      const supports = joinList([
        strongAffect && 'tight coupling between mood state and attentional failure',
        emotionalCapture && 'attentional capture by emotional content',
        internalCapture && 'capture by internal mental content',
        highVar && 'marked variability that tracks emotional state',
        contextDependent && 'context-sensitive performance',
      ], 3);
      const supportSentence = supports
        ? `Supporting findings include ${supports}.`
        : `The decision rests on the strong coupling between affect and attention noted in the dynamics section.`;
      const adhdRunnerNote = (runnerNearMiss && runner.id === 'A')
        ? ' Trait inattention was a near-miss alternative, but the attentional failure waxes and wanes with mood rather than presenting as a fixed deficit, which argues against committing to ADHD before the affective state is treated.'
        : '';

      if (affectType === 1) {
        const phenomBit = foggySlowed
          ? ' The foggy/slowed phenomenology paired with low-energy affect is a depressive cognitive signature rather than primary inattention.'
          : ' The low-energy affective profile points at a depressive cognitive process rather than primary inattention.';
        return `Attentional disturbance appears secondary to a depressive process; cognitive engagement is throttled downstream of mood rather than failing intrinsically. ${supportSentence}${phenomBit} Effective antidepressant treatment is the primary intervention — attentional complaints typically remit with mood recovery, and a stimulant trial before that risks treating an epiphenomenon.${adhdRunnerNote}`;
      }
      if (affectType === 2) {
        const phenomBit = (racing || scattered)
          ? ` ${racing ? 'Racing' : 'Scattered'} phenomenology is consistent with anxious cognitive overactivation rather than under-arousal.`
          : '';
        return `Attentional disturbance appears secondary to anxiety; working memory is hijacked by worry and threat-monitoring rather than failing intrinsically. ${supportSentence}${phenomBit} Anxiety treatment (SSRI, CBT, or anxiolytic) should precede an ADHD work-up — the distinguishing feature is that anxious inattention carries distress about failing, whereas trait inattention more often presents with frustration or indifference.${adhdRunnerNote}`;
      }
      if (affectType === 3) {
        const phenomBit = blank
          ? ' Blank/disengaged phenomenology in the setting of dysphoric activation is particularly suggestive of a mixed depressive state, in which over-aroused negative affect coexists with cognitive shutdown.'
          : ' The combination of negative affect and irritable arousal is suggestive of a mixed or dysphoric mood episode rather than unipolar depression alone.';
        return `Attentional disturbance appears driven by a mixed/dysphoric affective state in which irritability and negative arousal disrupt sustained attention. ${supportSentence}${phenomBit} This presentation can mimic ADHD strikingly — irritability plus inattention is a classic mixed-features look — but a stimulant before mood characterization risks worsening dysphoria; longitudinal data and consideration of a mood stabilizer are preferable first steps.${adhdRunnerNote}`;
      }
      if (affectType === 4) {
        const phenomBit = racing
          ? ' Racing phenomenology raises specific concern for hypomanic-spectrum cognition rather than primary inattention.'
          : ' The activated affective profile raises concern for hypomanic-spectrum cognition rather than primary inattention.';
        return `Attentional disturbance appears driven by affective activation; the system is over-aroused and disorganized rather than under-attentive. ${supportSentence}${phenomBit} A bipolar-spectrum work-up (history of mood elevation, decreased need for sleep) is essential before any stimulant consideration, which could destabilize an underlying mood disorder; mood stabilization comes first.${adhdRunnerNote}`;
      }
      return `Attentional disturbance appears secondary to affective dysregulation. ${supportSentence} Characterizing the affective state more precisely is the next step before any trait attribution.${adhdRunnerNote}`;
    }

    if (id === 'D') {
      const supports = joinList([
        internalCapture && 'attention dominantly captured by internal content',
        preservedTasks && 'preserved performance on structured tasks (capacity is intact)',
        crowded && 'crowded/overcontrolled phenomenology',
        racing && 'a racing thought stream',
        blank && 'episodes of blank disengagement',
      ], 3);
      let contentHypothesis;
      if (crowded) {
        contentHypothesis = 'The crowded, overcontrolled quality is most suggestive of obsessive-compulsive content (intrusive, ego-dystonic, resisted) or trauma-related re-experiencing rather than ordinary worry.';
      } else if (racing) {
        contentHypothesis = 'A racing thought stream points at anxious rumination, hypomanic-spectrum activation, or stimulant-related cognition; the differential narrows on whether the content is goal-driven or worry-driven.';
      } else if (blank) {
        contentHypothesis = 'Blank/disengaged episodes raise the possibility of dissociation, absence-like phenomena, or severe ruminative withdrawal rather than a typical preoccupation.';
      } else {
        contentHypothesis = 'The most likely content is ruminative depressive thought or generalized worry; if the material is bizarre or ego-syntonic, psychotic-spectrum preoccupation should be considered.';
      }
      const preservedClause = preservedTasks
        ? ' Preserved structured-task performance reinforces that capacity is not the problem — attention is being spent elsewhere.'
        : '';
      return `Apparent inattention reflects internal attentional capture rather than a primary attentional deficit; capacity is intact but redirected. ${supports ? `Supporting findings include ${supports}. ` : ''}${contentHypothesis}${preservedClause} The therapeutic target is the absorbing content (OCD, rumination, PTSD intrusions, psychosis) rather than the attention system itself.`;
    }

    if (id === 'E') {
      const supports = joinList([
        lowEnergy && 'a low-energy affective profile',
        reducedTenacity && 'reduced tenacity for sustained effort',
        lowVar && 'low variability (the impairment is constant rather than fluctuating)',
      ], 3);
      let mechanism;
      if (foggySlowed && !blank) {
        mechanism = 'The foggy/slowed quality combined with low energy points most strongly at a depressive or anhedonic cognitive process — the system is engaged but throttled.';
      } else if (blank && !foggySlowed) {
        mechanism = 'Blank/disengaged phenomenology — distinct from cognitive fog — points more toward a sedating-medication effect, a primary medical process (thyroid, B12, sleep-disordered breathing), or anhedonic withdrawal, rather than effortful slowing.';
      } else if (foggySlowed && blank) {
        mechanism = 'Mixed foggy and blank phenomenology suggests a heavily sedating contributor — medication burden, untreated sleep-disordered breathing, or severe depression — rather than a single mechanism.';
      } else {
        mechanism = 'The most likely contributors are depressive, medical (thyroid, B12, sleep-disordered breathing), or medication-related rather than a selective attentional deficit.';
      }
      return `Pattern consistent with global cognitive slowing rather than a selective attentional deficit. ${supports ? `Supporting findings include ${supports}. ` : ''}${mechanism} Workup should target systemic contributors (mood, sleep, medications, basic medical screen) before any inattention diagnosis is entertained.`;
    }

    return '';
  };

  const interpretation = buildInterpretation(primary.id);

  const nextStepsMap = {
    A: ["Confirm childhood onset with collateral if possible", "Confirm cross-setting impairment (work, home, social)", "Assess functional consequences and adaptive strategies", "Consider stimulant or non-stimulant trial"],
    B: ["Identify primary driver: sleep, stress, medical, or medication", "Do NOT diagnose ADHD at this time", "Address modifiable state factors first", "Reassess attentional profile after stabilization"],
    C: [],
    D: ["Assess for OCD (intrusive, ego-dystonic content)", "Screen for ruminative depression or GAD", "Evaluate for trauma-related intrusions (PTSD)", "Consider psychosis spectrum if content is bizarre or ego-syntonic", "Target the absorbing content, not the attention system"],
    E: ["Screen for depression (PHQ-9, clinical interview)", "Review sleep hygiene and sleep disorders", "Medical workup: thyroid, B12, metabolic panel", "Medication review — sedating agents, anticholinergics"],
  };

  // Pathway C sub-branching for next-steps (interpretation handles its own affect-aware branching)
  if (primary.id === 'C') {
    const subBranchSteps = {
      1: ["Treat depression first", "Attentional complaints often resolve with effective antidepressant treatment", "Reassess attention after mood stabilization"],
      2: ["Treat anxiety first — anxiolytic or SSRI", "Differentiate from ADHD: anxious inattention has distress about failure; ADHD-pattern has frustration", "Reassess attention after anxiety management"],
      3: ["Evaluate for mixed features (DSM-5 specifier)", "Mood stabilizer may be indicated before stimulant consideration", "Irritability + inattention mimics ADHD — do not diagnose without longitudinal data"],
      4: ["Assess for mania/hypomania history", "Check sleep patterns — decreased need is a red flag", "Stimulants are contraindicated if bipolar is suspected", "Mood stabilizer first"],
    };
    nextStepsMap.C = subBranchSteps[affectType] || ["Characterize the affective state more precisely", "Treat mood/anxiety before attributing to ADHD"];
  }

  // ── Conflict detection ──
  const conflicts = [];

  // ADHD + high variability
  if (primary.id === 'A' && highVar) {
    conflicts.push({
      label: "ADHD + High Variability",
      text: "ADHD diagnosis is uncertain due to elevated attentional variability, which is atypical for a purely trait-based disorder. High variability suggests a state-dependent component that should be evaluated before attributing to ADHD.",
    });
  }

  // Good tasks + poor real-world (observation)
  if (preservedTasks && obsAvg !== null && obsAvg <= 2.5) {
    conflicts.push({
      label: "Task–Function Discrepancy",
      text: "Structured task performance exceeds real-world functioning (observation). Consider: hot EF impairment (intact cool EF, impaired under emotional load), affective interference in naturalistic contexts, or environmental/contextual drivers that structured testing doesn't capture.",
    });
  }

  // Poor tasks + intact observation
  if (taskAvg !== null && taskAvg <= 2.5 && obsAvg !== null && obsAvg >= 3.5) {
    conflicts.push({
      label: "Testing Artifact Possible",
      text: "Formal testing may underestimate true function. The patient performs worse on structured tasks than in natural conversation. Consider: test anxiety, effort/motivation issues, the 'experimental condition' effect, or specific cognitive deficits (working memory, processing speed) that structured tasks expose.",
    });
  }

  // Affective + ADHD competition
  if (primary.id === 'A' && runner && runner.id === 'C' && runner.met >= 2) {
    conflicts.push({
      label: "ADHD vs. Affective Overlap",
      text: "Both ADHD-pattern and affective-driven patterns have significant support. The presence of strong affective coupling argues against a pure ADHD interpretation. Consider: comorbid ADHD + mood disorder, or affective disorder mimicking ADHD. Longitudinal assessment after mood stabilization is recommended before diagnosing ADHD.",
    });
  }

  // ── Build modifiers list ──
  const modifiers = [];
  if (highVar) modifiers.push("Marked variability");
  if (strongAffect) modifiers.push("Strong affective coupling");
  if (internalCapture) modifiers.push("Internal attentional capture");
  if (externalCapture) modifiers.push("External distractibility");
  if (emotionalCapture) modifiers.push("Emotional capture");
  if (taskAvoidance) modifiers.push("Task avoidance pattern");
  if (timeOnTaskDecline) modifiers.push("Time-on-task decline");
  if (contextDependent) modifiers.push("State-dependent");
  const phenom = s("dyn_phenom");
  const phenomLabels = { 1: "Foggy/slowed", 2: "Scattered", 3: "Crowded", 4: "Racing", 5: "Blank/disengaged", 6: "Overcontrolled" };
  if (phenom && phenomLabels[phenom]) modifiers.push(phenomLabels[phenom] + " phenomenology");

  // ADHD implication
  let implication = "";
  if (primary.id === 'A' && conflicts.length === 0) {
    implication = "Findings are consistent with ADHD. Proceed with confirmatory evaluation.";
  } else if (primary.id === 'A' && conflicts.length > 0) {
    implication = "ADHD is possible but conflicts exist. Address the flagged issues before diagnosing.";
  } else if (primary.id !== 'A') {
    implication = "ADHD diagnosis should be deferred pending resolution of the identified attentional driver.";
  }

  return {
    primary,
    runner: runner && runner.met >= 1 ? runner : null,
    isUrgent: false,
    interpretation,
    nextSteps: nextStepsMap[primary.id],
    implication,
    conflicts,
    modifiers,
    allPathways: pathways,
  };
}
