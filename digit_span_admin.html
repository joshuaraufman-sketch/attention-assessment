// ──────────────────────────────────────────────────────────────────
// Sequence generation
// Rules:
//  - No three or more consecutive ascending or descending digits
//  - No three or more identical consecutive digits
//  - No 7-digit sequences resembling phone numbers
//    (we just avoid sequences with too much internal regularity)
//  - Each trial different from all others at the same length
// ──────────────────────────────────────────────────────────────────

const isBadSequence = (seq) => {
  // Reject if any 3 consecutive digits are ascending or descending by 1
  for (let i = 0; i < seq.length - 2; i++) {
    const a = seq[i], b = seq[i+1], c = seq[i+2];
    if ((b - a === 1 && c - b === 1) || (a - b === 1 && b - c === 1)) return true;
    if (a === b && b === c) return true; // three identical in a row
  }
  // Reject if more than half the digits are the same
  const counts = {};
  seq.forEach(d => counts[d] = (counts[d] || 0) + 1);
  const max = Math.max(...Object.values(counts));
  if (max > Math.ceil(seq.length / 2)) return true;
  // Reject sequences starting with very common phone-number prefixes
  if (seq.length >= 7) {
    const start = seq.slice(0, 3).join('');
    if (['555', '800', '888', '877', '866', '900', '911', '411'].includes(start)) return true;
  }
  // Reject if it's too "round" — all even or all odd
  if (seq.length >= 4 && seq.every(d => d % 2 === 0)) return true;
  if (seq.length >= 4 && seq.every(d => d % 2 === 1)) return true;
  return false;
};

const generateSequence = (length, existing = []) => {
  let attempts = 0;
  while (attempts < 200) {
    attempts++;
    const seq = Array.from({ length }, () => Math.floor(Math.random() * 10));
    if (isBadSequence(seq)) continue;
    const seqStr = seq.join('');
    if (existing.includes(seqStr)) continue;
    return seq;
  }
  // Fallback — shouldn't happen but just in case
  return Array.from({ length }, () => Math.floor(Math.random() * 10));
};

const generateAllSequences = () => {
  const forward = {};
  const backward = {};
  const used = [];

  // Forward: 3 through 9 digits, 2 trials each
  for (let len = 3; len <= 9; len++) {
    forward[len] = [];
    for (let t = 0; t < 2; t++) {
      const seq = generateSequence(len, used);
      forward[len].push(seq);
      used.push(seq.join(''));
    }
  }

  // Backward: 2 through 8 digits, 2 trials each
  for (let len = 2; len <= 8; len++) {
    backward[len] = [];
    for (let t = 0; t < 2; t++) {
      const seq = generateSequence(len, used);
      backward[len].push(seq);
      used.push(seq.join(''));
    }
  }

  return { forward, backward };
};

// ──────────────────────────────────────────────────────────────────
// Pacer hook — beeps once per second when active
// ──────────────────────────────────────────────────────────────────

const usePacer = () => {
  const audioCtxRef = useRef(null);
  const intervalRef = useRef(null);
  const [active, setActive] = useState(false);
  const [tick, setTick] = useState(0);

  const beep = useCallback(() => {
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) { /* audio not available */ }
  }, []);

  const start = useCallback(() => {
    setActive(true);
    setTick(0);
    beep();
    let t = 0;
    intervalRef.current = setInterval(() => {
      t++;
      setTick(t);
      beep();
    }, 1000);
  }, [beep]);

  const stop = useCallback(() => {
    setActive(false);
    setTick(0);
    if (intervalRef.current) {
      clearInterval(intervalRef.current);
      intervalRef.current = null;
    }
  }, []);

  useEffect(() => () => stop(), [stop]);

  return { active, tick, start, stop };
};

const FORWARD_LENGTHS = [3, 4, 5, 6, 7, 8, 9];
const BACKWARD_LENGTHS = [2, 3, 4, 5, 6, 7, 8];

// ──────────────────────────────────────────────────────────────────
// Parent integration — postMessage back to the Clinical Assessment
// ──────────────────────────────────────────────────────────────────

const IS_CHILD_MODE = (() => {
  try {
    const params = new URLSearchParams(window.location.search);
    return params.get('parent') === 'true';
  } catch { return false; }
})();

// Map forward span to task_1 anchor score (1-5)
const forwardSpanToScore = (span) => {
  if (span <= 2) return 1;  // "≤2 digits"
  if (span === 3) return 2; // "3 digits"
  if (span === 4) return 3; // "4 digits"
  if (span === 5) return 4; // "5 digits"
  return 5;                 // "≥6 digits"
};

// Map backward span to task_2 anchor score (1-5)
const backwardSpanToScore = (span) => {
  if (span <= 1) return 1;  // "Unable to perform"
  if (span === 2) return 2; // "2 digits"
  if (span === 3) return 3; // "3 digits"
  if (span === 4) return 4; // "4 digits"
  return 5;                 // "≥5 digits"
};

const buildResultPayload = (forwardSpan, backwardSpan) => {
  const payload = {
    tool: 'digit_span',
    version: 1,
    results: {
      forwardSpan,
      backwardSpan,
      discrepancy: forwardSpan > 0 && backwardSpan > 0 ? forwardSpan - backwardSpan : null,
      forwardFlag: forwardSpan >= 5 ? 'normal' : 'below',
      backwardFlag: backwardSpan >= 3 ? 'normal' : 'below',
    },
    suggestedScores: {},
  };
  if (forwardSpan > 0) payload.suggestedScores.task_1 = forwardSpanToScore(forwardSpan);
  if (backwardSpan > 0) payload.suggestedScores.task_2 = backwardSpanToScore(backwardSpan);
  return payload;
};

function DigitSpan() {
  const [sequences, setSequences] = useState(() => generateAllSequences());
  const [trials, setTrials] = useState({});
  // trials: { 'forward-3-0': 'pass'|'fail'|null, 'forward-3-1': ... }
  const [activeTab, setActiveTab] = useState('forward');
  const pacer = usePacer();

  const setTrial = useCallback((key) => {
    setTrials(prev => {
      const current = prev[key];
      const next = current === 'pass' ? 'fail' : current === 'fail' ? null : 'pass';
      return { ...prev, [key]: next };
    });
  }, []);

  const regenerate = useCallback(() => {
    if (!confirm('Generate new sequences? This will clear all current scoring.')) return;
    setSequences(generateAllSequences());
    setTrials({});
  }, []);

  const resetTrials = useCallback(() => {
    if (!confirm('Clear all scoring? Sequences will remain the same.')) return;
    setTrials({});
  }, []);

  // Compute span for a given direction
  const computeSpan = (direction, lengths) => {
    let span = 0;
    for (const len of lengths) {
      const t1 = trials[`${direction}-${len}-0`];
      const t2 = trials[`${direction}-${len}-1`];
      if (t1 === 'pass' || t2 === 'pass') {
        span = len;
      } else if (t1 === 'fail' && t2 === 'fail') {
        // Both trials at this length failed — stop
        break;
      } else if (t1 == null && t2 == null) {
        // Not yet tested — don't count beyond this
        break;
      }
      // If one trial is pass and the other unrated, we still count the pass
      // but we keep going since the next length might be tested
    }
    return span;
  };

  const forwardSpan = useMemo(() => computeSpan('forward', FORWARD_LENGTHS), [trials]);
  const backwardSpan = useMemo(() => computeSpan('backward', BACKWARD_LENGTHS), [trials]);

  const discrepancy = forwardSpan > 0 && backwardSpan > 0 ? forwardSpan - backwardSpan : null;
  const flagDiscrepancy = discrepancy !== null && discrepancy > 2;

  const [sendStatus, setSendStatus] = useState('');

  const sendToAssessment = useCallback(() => {
    if (forwardSpan === 0 && backwardSpan === 0) return;
    const payload = buildResultPayload(forwardSpan, backwardSpan);
    let sent = false;
    // Try postMessage to opener window
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'bedside-tool-result', payload }, '*');
        sent = true;
      }
    } catch (e) { /* cross-origin or blocked */ }
    if (sent) {
      setSendStatus('Sent');
      setTimeout(() => setSendStatus(''), 2500);
    } else {
      // Fallback: copy JSON to clipboard for manual paste
      const json = JSON.stringify(payload);
      try {
        navigator.clipboard.writeText(json);
        setSendStatus('Copied — paste in Assessment');
        setTimeout(() => setSendStatus(''), 4000);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = json;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setSendStatus('Copied — paste in Assessment');
        setTimeout(() => setSendStatus(''), 4000);
      }
    }
  }, [forwardSpan, backwardSpan]);

  const renderSequenceTable = (direction) => {
    const lengths = direction === 'forward' ? FORWARD_LENGTHS : BACKWARD_LENGTHS;
    const seqs = sequences[direction];

    return (
      <div>
        <div className="seq-row header-row">
          <div>Len</div>
          <div>Trial 1</div>
          <div>Trial 2</div>
          <div className="seq-status-header">Status</div>
        </div>
        {lengths.map(len => {
          const t1Key = `${direction}-${len}-0`;
          const t2Key = `${direction}-${len}-1`;
          const t1 = trials[t1Key];
          const t2 = trials[t2Key];
          const passed = t1 === 'pass' || t2 === 'pass';
          const bothFailed = t1 === 'fail' && t2 === 'fail';
          let statusText = '—';
          let statusClass = 'pending';
          if (passed) {
            statusText = 'Pass';
            statusClass = 'pass';
          } else if (bothFailed) {
            statusText = 'Discontinue';
            statusClass = 'fail';
          }

          return (
            <React.Fragment key={len}>
              <div className="seq-row">
                <div className="seq-len">{len}</div>
                <div className="seq-cell">
                  <div className="seq-display">{seqs[len][0].join(' ')}</div>
                  <div className="trial-btns">
                    <button
                      className={`trial-btn ${t1 === 'pass' ? 'pass' : t1 === 'fail' ? 'fail' : ''}`}
                      onClick={() => setTrial(t1Key)}
                      title="Click to cycle: untouched → pass → fail → untouched"
                    >
                      {t1 === 'pass' ? '✓' : t1 === 'fail' ? '✗' : '—'}
                    </button>
                  </div>
                </div>
                <div className="seq-cell">
                  <div className="seq-display">{seqs[len][1].join(' ')}</div>
                  <div className="trial-btns">
                    <button
                      className={`trial-btn ${t2 === 'pass' ? 'pass' : t2 === 'fail' ? 'fail' : ''}`}
                      onClick={() => setTrial(t2Key)}
                      title="Click to cycle: untouched → pass → fail → untouched"
                    >
                      {t2 === 'pass' ? '✓' : t2 === 'fail' ? '✗' : '—'}
                    </button>
                  </div>
                </div>
                <div className={`seq-status ${statusClass}`}>{statusText}</div>
              </div>
            </React.Fragment>
          );
        })}
      </div>
    );
  };

  return (
    <>
      <style>{css}</style>
      <div className="app">
        <div className="header">
          <h1>Digit Span — Administration Tool</h1>
          <div className="subtitle">Bedside resource for forward & backward digit span testing</div>
        </div>

        {IS_CHILD_MODE && (
          <div className="send-banner">
            Opened from Clinical Attention Assessment. When finished scoring, use <strong>"Send to Assessment"</strong> below to transfer results back automatically.
          </div>
        )}

        {/* Pacer */}
        <div className="card">
          <div className="card-header">
            <h2>1-Hz Pacer</h2>
          </div>
          <div className="card-body">
            <div className="pacer">
              <button
                className={`pacer-btn ${pacer.active ? 'active' : ''}`}
                onClick={pacer.active ? pacer.stop : pacer.start}
              >
                {pacer.active ? 'Stop' : 'Start'} pacer
              </button>
              <div className={`pacer-dot ${pacer.active && pacer.tick % 2 === 0 ? 'tick' : ''}`}></div>
              <div className="pacer-text">
                {pacer.active
                  ? 'Read one digit per beep. Avoid rhythmic grouping or vocal stress patterns.'
                  : 'Plays a soft tone once per second to anchor delivery rate.'}
              </div>
            </div>
            <div className="tip">
              💡 The most common administration error is reading too fast (~1.5–2 Hz), which inflates spans by 1–2 digits. Use the pacer for at least the first few patients until 1 Hz feels natural.
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div className="tabs">
          <button
            className={`tab ${activeTab === 'forward' ? 'active' : ''}`}
            onClick={() => setActiveTab('forward')}
          >
            Forward (attention)
          </button>
          <button
            className={`tab ${activeTab === 'backward' ? 'active' : ''}`}
            onClick={() => setActiveTab('backward')}
          >
            Backward (working memory)
          </button>
          <button
            className={`tab ${activeTab === 'results' ? 'active' : ''}`}
            onClick={() => setActiveTab('results')}
          >
            Results
          </button>
        </div>

        {/* Forward */}
        {activeTab === 'forward' && (
          <>
            <div className="card">
              <div className="card-header">
                <h2>Forward — Administration</h2>
              </div>
              <div className="card-body">
                <div className="instructions">
                  <ul>
                    <li>Read each sequence at <strong>one digit per second</strong>. Avoid rhythmic grouping (no chunking like "5-2-7... 8-4").</li>
                    <li>Start at length 3. Give <strong>both trials</strong> at each length even if the first passes — this reduces ceiling artifacts and improves reliability.</li>
                    <li>Discontinue when the patient fails <strong>both</strong> trials at a given length.</li>
                    <li>Score: longest length where the patient correctly repeated <strong>at least one</strong> of two trials.</li>
                  </ul>
                </div>
                <div className="script">
                  <div className="script-label">Script</div>
                  "I'm going to say some numbers. After I finish, repeat them back to me <strong>in the same order</strong>. Listen carefully — I'll only say each list once. Ready?"
                </div>
              </div>
            </div>
            <div className="card">
              <div className="card-header">
                <h2>Forward — Sequences & Scoring</h2>
              </div>
              <div className="card-body">
                {renderSequenceTable('forward')}
              </div>
            </div>
          </>
        )}

        {/* Backward */}
        {activeTab === 'backward' && (
          <>
            <div className="card">
              <div className="card-header">
                <h2>Backward — Administration</h2>
              </div>
              <div className="card-body">
                <div className="instructions">
                  <ul>
                    <li><strong>Demonstrate first</strong> with a 2-digit example (see script). Confirm the patient understands before starting trials.</li>
                    <li>Read at <strong>one digit per second</strong>, no rhythmic grouping.</li>
                    <li>Start at length 2. Give both trials at each length.</li>
                    <li>Discontinue when the patient fails both trials at a given length.</li>
                    <li>Score: longest length where the patient correctly reversed <strong>at least one</strong> of two trials.</li>
                    <li><strong>Forward − Backward &gt; 2</strong> suggests a working memory deficit beyond simple attentional impairment.</li>
                  </ul>
                </div>
                <div className="script">
                  <div className="script-label">Script — demonstration</div>
                  "Now I'll say more numbers, but this time I want you to repeat them <strong>backward</strong>. For example, if I say <strong>3, 8</strong>, you would say <strong>8, 3</strong>. If I say <strong>1, 7, 4</strong>, you would say <strong>4, 7, 1</strong>. Let's try one — <em>[say 5, 9]</em> — what would you say?"
                  <br/><br/>
                  <em>Wait for correct response (9, 5) before proceeding. If wrong, demonstrate again with a different pair. Do not proceed to trials until the patient demonstrates understanding.</em>
                </div>
              </div>
            </div>
            <div className="card">
              <div className="card-header">
                <h2>Backward — Sequences & Scoring</h2>
              </div>
              <div className="card-body">
                {renderSequenceTable('backward')}
              </div>
            </div>
          </>
        )}

        {/* Results */}
        {activeTab === 'results' && (
          <div className="card">
            <div className="card-header">
              <h2>Results</h2>
            </div>
            <div className="card-body">
              <div className="results-grid">
                <div className="result-card">
                  <div className="result-label">Forward span</div>
                  <div className="result-value">{forwardSpan || '—'}</div>
                  <div className="result-norm">Normal ≥ 5</div>
                  {forwardSpan > 0 && (
                    <div className={`result-flag ${forwardSpan >= 5 ? 'normal' : 'below'}`}>
                      {forwardSpan >= 5 ? 'Within normal limits' : 'Below normal'}
                    </div>
                  )}
                </div>
                <div className="result-card">
                  <div className="result-label">Backward span</div>
                  <div className="result-value">{backwardSpan || '—'}</div>
                  <div className="result-norm">Normal ≥ 3</div>
                  {backwardSpan > 0 && (
                    <div className={`result-flag ${backwardSpan >= 3 ? 'normal' : 'below'}`}>
                      {backwardSpan >= 3 ? 'Within normal limits' : 'Below normal'}
                    </div>
                  )}
                </div>
                <div className="result-card">
                  <div className="result-label">Forward − Backward</div>
                  <div className="result-value">{discrepancy !== null ? discrepancy : '—'}</div>
                  <div className="result-norm">Concerning if &gt; 2</div>
                  {discrepancy !== null && (
                    <div className={`result-flag ${flagDiscrepancy ? 'discrepancy' : 'normal'}`}>
                      {flagDiscrepancy ? 'Elevated' : 'Within expected range'}
                    </div>
                  )}
                </div>
              </div>

              {flagDiscrepancy && (
                <div className="discrepancy-panel warn">
                  <strong>⚠ Forward–Backward Discrepancy: {discrepancy} digits</strong>
                  A discrepancy greater than 2 digits suggests that working memory (manipulation) is more impaired than the patient's basic attentional capacity (registration and immediate recall). This pattern is seen in conditions involving prefrontal/executive dysfunction — including ADHD, depression with cognitive features, early neurocognitive decline, frontal lesions, and certain medication effects (anticholinergics, benzodiazepines). Consider follow-up with formal neuropsychological assessment if this finding is unexpected or persists after addressing reversible factors.
                </div>
              )}

              {!flagDiscrepancy && discrepancy !== null && (
                <div className="discrepancy-panel normal">
                  <strong>Forward–Backward gap within expected range</strong>
                  A gap of 0–2 digits is typical. Forward and backward spans are tracking together, suggesting the manipulation component of working memory is not selectively impaired relative to attentional registration. If forward span itself is below normal, the limitation is more likely at the level of attention/registration than working memory per se.
                </div>
              )}

              {forwardSpan === 0 && backwardSpan === 0 && (
                <div className="tip" style={{ marginTop: 16 }}>
                  No trials scored yet. Switch to the Forward or Backward tab to administer.
                </div>
              )}
            </div>
          </div>
        )}

        {/* Action bar */}
        <div className="action-bar">
          {(forwardSpan > 0 || backwardSpan > 0) && (
            <button className="btn btn-send" onClick={sendToAssessment}>
              {sendStatus || (IS_CHILD_MODE ? 'Send to Assessment' : 'Send to Assessment')}
            </button>
          )}
          <button className="btn btn-primary" onClick={regenerate}>Generate new sequences</button>
          <button className="btn btn-secondary" onClick={resetTrials}>Clear scoring</button>
        </div>

        <div className="footer">
          Companion to the Clinical Attention Assessment.<br/>
          Norms: forward ≥ 5, backward ≥ 3 (Albertella et al., 2026; Lezak, <em>Neuropsychological Assessment</em>).<br/>
          Sequences regenerate randomly with patterns filtered (no ascending/descending runs ≥ 3, no triple-repeats, no phone-prefix starts).
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DigitSpan));
</script>
</body>
</html>
